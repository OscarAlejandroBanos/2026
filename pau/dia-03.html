<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 3 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* texto alineado a la izquierda: en pantalla la justificación abre ríos y la partición de palabras depende del navegador */
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Examenes/2016_general_llengua_castellana_titular.pdf—, que no tiene por
   donde partirse: sin esto mide 425 px y en un movil de 390 desplaza de lado
   la pagina entera */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  overflow-wrap:anywhere;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

</style>
</head>
<body>
<div class="env">
  <header class="top">
    <p class="volver"><a href="../pau-trimestres.html#sesion/2026-10-01">Volver a la sesión</a></p>
    <div class="kicker">PAU +25 · primer trimestre</div>
    <h1>Jueves 1 de octubre</h1>
    <p class="sub">Diptongo, triptongo, hiato · el esqueleto de la redacción y las dos extensiones · la categoría de una palabra en su oración</p>
  </header>
</div>
<div class="pie">
  <div class="env2">
    <span class="txt" id="progtxt">—</span>
    <span class="barra"><i></i></span>
    <button type="button" id="bexp">Guardar progreso</button>
    <button type="button" id="bimp">Cargar</button>
    <button type="button" id="bres">Borrar</button>
  </div>
</div>

<script>window.DIA = {"dia": 3, "fecha": "2026-10-01", "tab": "Día 3 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Jueves 1 de octubre", "sub": "Diptongo, triptongo, hiato · el esqueleto de la redacción y las dos extensiones · la categoría de una palabra en su oración", "carriles": [{"chapa": "Carril A", "titulo": "Diptongo, triptongo, hiato", "meta": "15 minutos · dos vocales juntas: una sílaba o dos", "teoria": "<p>En «ciu» de <i>ciudad<\/i> hay dos vocales y una sola sílaba; en <i>te-a-tro<\/i> hay dos vocales juntas y dos sílabas. Decidir cuál de las dos situaciones se da resuelve cuatro de cada diez palabras del ejercicio de tildes: de las 79 que han caído, 17 llevan tilde por ser hiato y otras 16 son señuelos con dos vocales juntas que forman diptongo. Hoy se aprende a separarlas; el martes, a acentuarlas.<\/p>\n\n<h3>Abiertas y cerradas<\/h3>\n<p>Las cinco vocales se reparten en dos grupos: <b>abiertas<\/b>, <i>a, e, o<\/i>, y <b>cerradas<\/b>, <i>i, u<\/i>. Se llaman así por la boca: para decir <i>a<\/i> se abre del todo y para decir <i>i<\/i> se cierra casi entera. De ese reparto sale todo lo demás.<\/p>\n\n<h3>El diptongo<\/h3>\n<p>Un diptongo son <b>dos vocales en la misma sílaba<\/b>: se pronuncian de un tirón. Solo hay tres maneras de formarlo:<\/p>\n<table>\n<tr><th>tipo<\/th><th>combinación<\/th><th>cuáles<\/th><th>ejemplos<\/th><\/tr>\n<tr><td><b>creciente<\/b><\/td><td>cerrada + abierta · la boca se abre<\/td><td>ia, ie, io, ua, ue, uo<\/td><td><i>ra-dio<\/i>, <i>pie<\/i>, <i>cuo-ta<\/i><\/td><\/tr>\n<tr><td><b>decreciente<\/b><\/td><td>abierta + cerrada · la boca se cierra<\/td><td>ai, ei, oi, au, eu, ou<\/td><td><i>ai-re<\/i>, <i>pei-ne<\/i>, <i>cau-sa<\/i><\/td><\/tr>\n<tr><td><b>homogéneo<\/b><\/td><td>cerrada + cerrada · la boca ni se abre ni se cierra<\/td><td>ui, iu<\/td><td><i>rui-do<\/i>, <i>ciu-dad<\/i>, <i>viu-da<\/i><\/td><\/tr>\n<\/table>\n<p><i>Ui<\/i> e <i>iu<\/i> aparecen a menudo colocados entre los decrecientes, y no lo son: en <i>ciudad<\/i> o en <i>ruido<\/i> no hay ninguna vocal abierta, así que la boca ni se abre ni se cierra. Dos avisos. La <b>h<\/b> entre vocales no rompe nada: <i>ahu-ma-do<\/i> sigue teniendo diptongo. Y en <b>gue, gui, que, qui<\/b> la <i>u<\/i> no suena, así que no hay diptongo: en <i>guerra<\/i>, <i>quince<\/i> o <i>máquina<\/i> solo hay una vocal en juego.<\/p>\n<p>El <b>triptongo<\/b> son tres vocales en la misma sílaba —cerrada átona + abierta + cerrada átona— y aparece casi siempre en la forma de <i>vosotros<\/i>: <i>es-tu-diáis<\/i>, <i>lim-piáis<\/i>, <i>a-ve-ri-güéis<\/i>.<\/p>\n\n<h3>El hiato<\/h3>\n<p>El diptongo junta dos vocales en una sílaba. El hiato hace lo contrario: <b>dos vocales juntas que se pronuncian en sílabas distintas<\/b>. <i>Te-a-tro<\/i> tiene tres sílabas; <i>ma-íz<\/i> tiene dos, con la <i>a<\/i> y la <i>i<\/i> separadas. Hay tres clases:<\/p>\n<table>\n<tr><th>clase<\/th><th>ejemplos<\/th><th>cómo se acentúa<\/th><\/tr>\n<tr><td>dos abiertas iguales<\/td><td><i>cre-er<\/i>, <i>le-er<\/i><\/td><td>por las tres reglas del martes<\/td><\/tr>\n<tr><td>dos abiertas distintas<\/td><td><i>te-a-tro<\/i>, <i>po-e-ta<\/i>, <i>ca-os<\/i><\/td><td>por las tres reglas del martes<\/td><\/tr>\n<tr><td><b>cerrada tónica + abierta<\/b>, o al revés<\/td><td><i>ma-íz<\/i>, <i>ba-úl<\/i>, <i>ma-yo-rí-a<\/i><\/td><td>siempre con tilde, sobre la cerrada: se estudia el 6 de octubre<\/td><\/tr>\n<\/table>\n\n<h3>Cómo se cuentan las sílabas<\/h3>\n<p>Tres pasos, sobre cada par de vocales juntas: (1) localiza las dos vocales; (2) si una de ellas es cerrada —<i>i<\/i>, <i>u<\/i>— y no lleva la fuerza, las dos van en la misma sílaba: diptongo; (3) si las dos son abiertas, o la cerrada lleva la fuerza, van en sílabas distintas: hiato. En <i>poesía<\/i> hay dos pares: «oe», dos abiertas, y «ía», con la <i>i<\/i> fuerte; los dos son hiatos y la palabra tiene cuatro sílabas, <i>po-e-sí-a<\/i>. En <i>aceite<\/i>, «ei» es abierta más cerrada sin fuerza: diptongo, y la palabra tiene tres, <i>a-cei-te<\/i>.<\/p>", "ejercicios": [{"tipo": "hueco", "titulo": "Separa en sílabas", "estricto": true, "ayuda": "Escribe cada palabra separada en sílabas, con guiones y sin espacios: <i>cau-sa<\/i>. Antes de escribir, dila en voz alta y cuenta los golpes de voz.", "items": [{"enun": "<i>causa<\/i>", "sol": "cau-sa", "porque": "«au», abierta + cerrada: diptongo, una sílaba"}, {"enun": "<i>teatro<\/i>", "sol": "te-a-tro", "porque": "«ea», dos abiertas: hiato, dos sílabas"}, {"enun": "<i>ciudad<\/i>", "sol": "ciu-dad", "porque": "«iu», dos cerradas: diptongo homogéneo"}, {"enun": "<i>poeta<\/i>", "sol": "po-e-ta", "porque": "«oe», dos abiertas: hiato"}, {"enun": "<i>ruido<\/i>", "sol": "rui-do", "porque": "«ui», dos cerradas: diptongo"}, {"enun": "<i>aceite<\/i>", "sol": "a-cei-te", "porque": "«ei», abierta + cerrada sin fuerza: diptongo"}, {"enun": "<i>leer<\/i>", "sol": "le-er", "porque": "dos abiertas iguales: hiato, y la palabra tiene dos sílabas"}], "criterio": "En las siete lo único que se decide es si las dos vocales juntas van en una sílaba o en dos, y la respuesta depende de qué vocales son: con una cerrada sin fuerza al lado de otra vocal, una sílaba; con dos abiertas, dos sílabas. <i>Ciudad<\/i> y <i>ruido<\/i> se separan mal con más frecuencia que las otras cinco, porque <i>ui<\/i> e <i>iu<\/i> suenan como dos golpes de voz y forman uno solo.", "apoyo": ["El diptongo", "El hiato"]}, {"tipo": "clasificar", "titulo": "¿Diptongo, triptongo o hiato?", "ops": ["diptongo", "triptongo", "hiato"], "ayuda": "Nueve palabras. Localiza las vocales juntas, mira si hay alguna cerrada sin fuerza y decide.", "items": [{"enun": "<i>aula<\/i>", "sol": "diptongo", "porque": "«au»: abierta + cerrada, decreciente"}, {"enun": "<i>feo<\/i>", "sol": "hiato", "porque": "«eo»: dos abiertas, <i>fe-o<\/i>"}, {"enun": "<i>cuota<\/i>", "sol": "diptongo", "porque": "«uo»: cerrada + abierta, creciente"}, {"enun": "<i>caos<\/i>", "sol": "hiato", "porque": "«ao»: dos abiertas, <i>ca-os<\/i>"}, {"enun": "<i>poema<\/i>", "sol": "hiato", "porque": "«oe»: dos abiertas, <i>po-e-ma<\/i>"}, {"enun": "<i>estudiáis<\/i>", "sol": "triptongo", "porque": "«iái»: cerrada + abierta + cerrada en una sílaba, <i>es-tu-diáis<\/i>"}, {"enun": "<i>viuda<\/i>", "sol": "diptongo", "porque": "«iu»: dos cerradas, homogéneo"}, {"enun": "<i>país<\/i>", "sol": "hiato", "porque": "«aí»: la cerrada lleva la fuerza, <i>pa-ís<\/i>"}, {"enun": "<i>peine<\/i>", "sol": "diptongo", "porque": "«ei»: abierta + cerrada, decreciente"}], "criterio": "Cuatro diptongos, cuatro hiatos y un triptongo. Los hiatos de dos abiertas —<i>feo<\/i>, <i>caos<\/i>, <i>poema<\/i>— no llevan ninguna marca escrita y se reconocen solo oyéndolos; el de <i>país<\/i> lleva la tilde sobre la <i>i<\/i> porque la cerrada es la fuerte, y esa tilde es la regla que se estudia el martes.", "apoyo": ["El diptongo", "El hiato"]}, {"tipo": "hueco", "titulo": "¿Cuántas sílabas?", "ayuda": "Escribe el número de sílabas de cada palabra. Cuenta cada par de vocales juntas por separado: una palabra puede tener un diptongo y un hiato a la vez.", "items": [{"enun": "<i>poesía<\/i>", "sol": "4|cuatro", "porque": "<i>po-e-sí-a<\/i>: dos hiatos"}, {"enun": "<i>guerra<\/i>", "sol": "2|dos", "porque": "<i>gue-rra<\/i>: la <i>u<\/i> no suena y no hay diptongo"}, {"enun": "<i>aéreo<\/i>", "sol": "4|cuatro", "porque": "<i>a-é-re-o<\/i>: «aé» y «eo», dos hiatos de abiertas"}, {"enun": "<i>averigüéis<\/i>", "sol": "4|cuatro", "porque": "<i>a-ve-ri-güéis<\/i>: la diéresis avisa de que la <i>u<\/i> suena, y «üéi» es un triptongo"}, {"enun": "<i>baúl<\/i>", "sol": "2|dos", "porque": "<i>ba-úl<\/i>: la cerrada lleva la fuerza, hiato"}, {"enun": "<i>continuo<\/i>", "sol": "3|tres", "porque": "<i>con-ti-nuo<\/i>: «uo» es diptongo creciente"}], "criterio": "Contar sílabas comprueba lo mismo que los dos ejercicios anteriores desde otro lado: cada hiato añade una sílaba y cada diptongo o triptongo la ahorra. <i>Continuo<\/i> tiene tres sílabas con el diptongo; cuando la <i>u<\/i> lleva la fuerza, <i>continúo<\/i>, el diptongo se rompe y la palabra pasa a tener cuatro, y ese cambio se estudia el martes con las palabras que se escriben con las mismas letras.", "apoyo": ["Cómo se cuentan las sílabas"]}]}, {"chapa": "Carril B", "titulo": "Escribir I: el esqueleto y las dos extensiones", "meta": "25 minutos · tesis, dos razones y cierre; 50-80 y 150-200 palabras; las dos rúbricas", "teoria": "<p>Los dos exámenes acaban pidiendo un texto argumentativo sobre el tema del texto que se acaba de leer. Cambian la extensión y la manera de puntuarlo:<\/p>\n<table>\n<tr><th><\/th><th>Llengua castellana 2.2<\/th><th>Comentari de text, parte 2<\/th><\/tr>\n<tr><td>vale<\/td><td>3 puntos<\/td><td>4 puntos<\/td><\/tr>\n<tr><td>extensión<\/td><td>50 a 80 palabras<\/td><td>150 a 200 palabras<\/td><\/tr>\n<tr><td>elección<\/td><td>un solo enunciado<\/td><td>dos enunciados, se elige uno<\/td><\/tr>\n<tr><td>qué pide<\/td><td>«exprese su opinión sobre…»<\/td><td>responder a una pregunta con dos argumentos como mínimo<\/td><\/tr>\n<tr><td>rúbrica<\/td><td>adecuación · coherencia · cohesión · riqueza de expresión<\/td><td>adecuación 1 · coherencia 1,5 · estilo 1,5<\/td><\/tr>\n<tr><td>extensión mal<\/td><td>—<\/td><td>−0,5 por bajar de 150 o pasar de 200<\/td><\/tr>\n<tr><td>faltas<\/td><td>−0,1 cada una, con tope de 2 puntos<\/td><td>−0,1 cada una, sin tope<\/td><\/tr>\n<\/table>\n<p>Entre los dos son 7 de los 20 puntos del curso.<\/p>\n\n<h3>El esqueleto, que es el mismo en los dos<\/h3>\n<p><b>Tesis · dos razones · cierre.<\/b> Las dos rúbricas piden lo mismo: que se sepa qué defiendes y que lo defiendas dos veces por caminos distintos. Lo que cambia entre un examen y el otro es cuánto cabe dentro de cada pieza: en 50-80 palabras la tesis es una frase, cada argumento una o dos y el cierre una; en 150-200, cada argumento lleva dentro un dato o un caso y su consecuencia, y cabe una concesión entera —<i>es cierto que… pero<\/i>— que en el formato corto entra, si entra, dentro del segundo argumento con un <i>aunque<\/i>.<\/p>\n\n<h3>Las cinco piezas, contadas<\/h3>\n<p><b>La tesis tiene que admitir la contraria.<\/b> «La contaminación es un problema» no sirve como tesis: nadie lo discute, así que no queda nada que defender y los dos argumentos acaban describiendo la situación en lugar de justificar una postura. «Voy a hablar de las redes sociales» tampoco: anuncia el tema y no dice nada sobre él. «El tiempo de desplazamiento al trabajo debería contar como jornada» sí admite réplica, y por eso se puede defender.<\/p>\n<p><b>Un argumento no es un ejemplo.<\/b> El argumento dice por qué pasa algo; el ejemplo cuenta un caso. «Mi vecino estudió de mayor y ahora está mejor» es un ejemplo; «estudiar de adulto cambia la relación con el trabajo, porque deja de ser el único sitio donde se puede mejorar» es un argumento. Un ejemplo cabe dentro de un argumento, en media línea. Solo, no defiende nada, porque siempre se puede contestar «pues yo conozco otro caso».<\/p>\n<p><b>Los dos argumentos tienen que ser distintos<\/b>, y cada uno entra con su conector —<i>en primer lugar<\/i>, <i>además<\/i>, <i>por otra parte<\/i>— para que el corrector localice dos argumentos y no uno repetido. Los criterios del comentario lo dicen con esas palabras: «dos argumentos válidos y diferentes, 0,5 puntos cada argumento». Son distintos cuando se apoyan en razones de distinta clase: uno en un dato y otro en un caso parecido; uno en dinero y otro en salud.<\/p>\n<p><b>El cierre saca una consecuencia y no repite la tesis.<\/b> Repetir la tesis con otras palabras baja la banda de coherencia, porque el corrector encuentra la misma idea dos veces y el texto no ha avanzado.<\/p>\n<p>La columna de esta página lleva las cinco piezas en el orden del esqueleto, con sus conectores a la vista, y los ejercicios van sobre ella.<\/p>", "lectura": {"titulo": "La lavadora de las once", "entrada": "Columna de prensa · <b>texto inventado para practicar<\/b>, con el formato y la arquitectura de los que caen en la prueba.", "lineas": ["Ramón pone la lavadora a las once de la noche y la tiende a", "las siete, antes de salir. Lo hace por la tarifa: desde que", "la factura distingue tres tramos de horas, la lavadora, el", "lavavajillas y la plancha de su casa trabajan de madrugada,", "y el que se levanta a recogerlos es él.", "", "Cobrar la luz según la hora traslada las tareas de la casa a", "la noche, y las traslada solo a quien no puede elegir su", "horario. En primer lugar, la diferencia de precio no es", "pequeña: el kilovatio de la hora punta, de seis a diez de la", "tarde, cuesta el doble que el de la madrugada, y una familia", "que cocina, se ducha y lava cuando vuelve del trabajo paga por", "el mismo consumo unos veinte euros más al mes que otra que", "puede repartirlo. Además, repartirlo no depende de la voluntad", "sino del horario: quien trabaja desde casa pone la lavadora a", "las tres de la tarde; quien sale del turno a las diez solo", "tiene la noche.", "", "Es cierto que la tarifa por horas descarga la red en las horas", "de más demanda y evita encender centrales de reserva, y ese", "ahorro existe. Pero lo ponen quienes no eligen cuándo trabajan,", "y lo ponen en horas de sueño. Por eso, mientras la tarifa se", "mida solo en kilovatios y no en horarios, el ahorro de la red", "lo seguirán pagando quienes menos pueden elegir."], "pie": "Texto inventado. Ni Ramón ni las cifras que da son reales."}, "ejercicios": [{"tipo": "hueco", "titulo": "¿En qué línea empieza cada pieza?", "estricto": true, "ayuda": "Seis piezas del texto. Escribe el número de la línea donde empieza cada una; si empieza al final de una línea y sigue en la siguiente, valen las dos.", "items": [{"enun": "La anécdota que abre el texto.", "sol": "1"}, {"enun": "La tesis.", "sol": "6|7"}, {"enun": "El primer argumento, con su conector.", "sol": "8"}, {"enun": "El segundo argumento, con su conector.", "sol": "13"}, {"enun": "La concesión.", "sol": "17"}, {"enun": "El cierre, que saca una consecuencia.", "sol": "20"}], "criterio": "Las piezas se localizan por sus marcas: la tesis es la primera frase que se puede negar, cada argumento entra con su conector —<i>en primer lugar<\/i>, <i>además<\/i>—, la concesión empieza por <i>es cierto que<\/i> y se cierra con <i>pero<\/i>, y el cierre arranca con <i>por eso<\/i> y dice qué pasará si nada cambia. Un texto de examen de 50-80 palabras —la cuarta parte de esta columna— lleva las mismas marcas en cinco frases.", "apoyo": ["El esqueleto, que es el mismo en los dos", "Las cinco piezas, contadas"]}, {"tipo": "clasificar", "titulo": "¿Sirve como tesis?", "ops": ["admite la contraria", "no la discute nadie", "solo anuncia el tema"], "ayuda": "Siete tesis para el enunciado «¿Debería cobrarse la electricidad al mismo precio a todas horas?». Di cuáles admiten la contraria y por qué fallan las otras.", "items": [{"enun": "«Ahorrar energía es bueno.»", "sol": "no la discute nadie", "porque": "nadie sostendría lo contrario, y con ella no queda nada que defender"}, {"enun": "«El descuento de la tarifa nocturna debería ampliarse a la tarde para quien trabaja a turnos.»", "sol": "admite la contraria", "porque": "alguien puede contestar que la tarifa tiene que ser igual para todos: hay postura"}, {"enun": "«Voy a hablar de la tarifa eléctrica por horas.»", "sol": "solo anuncia el tema", "porque": "dice de qué va el texto y no dice nada sobre ello"}, {"enun": "«La factura de la luz es un gasto importante para las familias.»", "sol": "no la discute nadie", "porque": "un adjetivo valorativo en lugar de una postura, y ninguna réplica posible"}, {"enun": "«La luz debería costar lo mismo a cualquier hora del día.»", "sol": "admite la contraria", "porque": "se puede sostener lo contrario, y de hecho la tarifa actual lo sostiene"}, {"enun": "«En este texto se habla de la lavadora de Ramón y de los tramos de la tarifa.»", "sol": "solo anuncia el tema", "porque": "resume el texto leído en lugar de tomar postura sobre la pregunta"}, {"enun": "«Los tramos horarios perjudican a quien trabaja a turnos.»", "sol": "admite la contraria", "porque": "alguien puede defender que los tramos benefician a todos por igual"}], "criterio": "Tres sirven y cuatro no, y las cuatro fallan por una de las dos razones de la teoría: o nadie las discute, o anuncian el tema sin decir nada sobre él. La comprobación es siempre la misma: escribir la frase contraria y comprobar si alguien la firmaría. «Ahorrar energía es malo» no la firma nadie, y por eso su contraria tampoco defiende nada; «la luz debería costar distinto según la hora» sí la firmaría la compañía eléctrica, y por eso «la luz debería costar lo mismo a cualquier hora» es una tesis.", "apoyo": ["Las cinco piezas, contadas"]}, {"tipo": "clasificar", "titulo": "¿Argumento o ejemplo?", "ops": ["argumento", "ejemplo"], "ayuda": "Seis frases sobre el tema del texto. El argumento dice por qué pasa algo; el ejemplo cuenta un caso.", "items": [{"enun": "«Encender las centrales de reserva en hora punta contamina más, así que repartir la demanda reduce emisiones.»", "sol": "argumento", "porque": "explica un mecanismo: por qué repartir la demanda tiene un efecto"}, {"enun": "«En mi escalera hay tres familias que planchan de madrugada.»", "sol": "ejemplo", "porque": "un caso contado, sin decir por qué pasa"}, {"enun": "«Mi cuñado pone el lavavajillas a las dos de la mañana.»", "sol": "ejemplo", "porque": "un caso; se contesta con «pues mi cuñado lo pone a las ocho»"}, {"enun": "«Cuando el precio cambia por horas, el ahorro va a parar a quien tiene horario flexible, que suele ser quien más cobra.»", "sol": "argumento", "porque": "dice a quién beneficia el mecanismo y por qué"}, {"enun": "«Quien hace turnos no puede mover su consumo a las horas baratas, porque no elige a qué hora está en casa.»", "sol": "argumento", "porque": "la razón lleva su <i>porque<\/i> dentro"}, {"enun": "«El año pasado mi factura de julio subió treinta euros.»", "sol": "ejemplo", "porque": "un dato de un caso, sin la razón que lo explica"}], "criterio": "Los tres ejemplos hablan de una persona o de una factura concretas; los tres argumentos hablan de lo que pasa siempre que se da una condición, y por eso llevan un <i>porque<\/i>, un <i>así que<\/i> o un <i>cuando<\/i>. El ejemplo cabe dentro del argumento como media línea de apoyo —«quien hace turnos no puede mover su consumo, como mi cuñado, que llega a las diez»—, y ahí sí ayuda.", "apoyo": ["Las cinco piezas, contadas"]}, {"tipo": "clasificar", "titulo": "¿De qué examen es cada condición?", "ops": ["Llengua castellana", "Comentari de text", "los dos"], "ayuda": "Ocho condiciones de las dos rúbricas. Di si valen para la redacción de Llengua castellana, para la del comentario o para las dos.", "items": [{"enun": "Cada falta descuenta 0,1.", "sol": "los dos", "porque": "en los dos exámenes; lo que cambia es el tope"}, {"enun": "Pide dos argumentos distintos, y cada uno vale 0,5.", "sol": "Comentari de text", "porque": "es la banda de adecuación del comentario, escrita así en sus criterios"}, {"enun": "Entre 50 y 80 palabras.", "sol": "Llengua castellana", "porque": "la extensión del 2.2 de castellano"}, {"enun": "Se elige entre dos enunciados.", "sol": "Comentari de text", "porque": "castellano da un solo enunciado"}, {"enun": "El texto tiene que ser argumentativo y sobre el tema del texto leído.", "sol": "los dos", "porque": "los dos piden opinar sobre el tema del texto de partida"}, {"enun": "Entre 150 y 200 palabras.", "sol": "Comentari de text", "porque": "la extensión de la parte 2 del comentario"}, {"enun": "El descuento por faltas se detiene en 2 puntos.", "sol": "Llengua castellana", "porque": "en el comentario no hay tope"}, {"enun": "Pasarse de la extensión o no llegar descuenta 0,5.", "sol": "Comentari de text", "porque": "en castellano la extensión entra en la adecuación, sin cifra aparte"}], "criterio": "Las condiciones que cambian de un examen a otro son cuatro: la extensión, el número de enunciados, el tope de las faltas y la cifra por argumento. Con ellas se decide cómo se reparte el tiempo: en el comentario, contar las palabras al final no es opcional, porque pasarse de 200 o no llegar a 150 descuenta tanto como un argumento entero.", "apoyo": ["intro"]}, {"tipo": "abierta", "titulo": "El plan de tres líneas", "ayuda": "Tres minutos, como en el examen. Todavía no se escribe el texto: solo el plan.", "items": [{"enun": "Para el enunciado «¿Debería cobrarse la electricidad al mismo precio a todas horas?», escribe el plan de tres líneas: tu tesis, en una frase que admita la contraria; tus dos razones, de clases distintas —un dato, un caso parecido, la experiencia propia—; y cómo cierras, con una consecuencia y no con la tesis repetida.", "modelo": "Tesis: la luz debería costar lo mismo a todas horas, porque el precio por tramos solo lo aprovecha quien elige su horario. Razón 1, un dato: la hora punta cuesta el doble que la madrugada, y quien vuelve del turno a las diez consume en punta sin poder evitarlo. Razón 2, un caso parecido: el agua se cobra igual a cualquier hora y nadie pide que ducharse a las ocho cueste más. Cierre: si el precio depende del horario, el ahorro se lo queda quien tiene un horario que elegir."}], "criterio": "El plan se da por bueno si la tesis admite réplica, si las dos razones son de clases distintas —en el modelo, un dato y un caso parecido— y si el cierre dice algo que no estaba en la tesis. Un plan con dos razones de la misma clase produce después dos argumentos que dicen lo mismo con dos cifras, y la rúbrica del comentario los cuenta como uno.", "apoyo": ["El esqueleto, que es el mismo en los dos", "Las cinco piezas, contadas"]}]}, {"chapa": "Carril C", "titulo": "La categoría de una palabra en su oración", "meta": "50 minutos · las diez palabras del censo, las tres fronteras y los cuatro ítems reales", "teoria": "<p>El ítem del examen no pregunta qué es una palabra: pregunta <b>qué es en esa oración<\/b>. Ha caído en 12 de los 24 exámenes, y el enunciado alterna dos formulaciones —«¿qué clase de palabra es…?» y «¿a qué categoría gramatical pertenece…?»— que preguntan lo mismo. Las palabras que pregunta son casi todas de las que cambian de clase según dónde estén.<\/p>\n\n<h3>Las diez palabras del censo<\/h3>\n<p>Las diez palabras que han caído en los doce ítems: <i>ya<\/i>, <i>aun<\/i>, <i>entonces<\/i>, <i>siempre<\/i>, <i>incluso<\/i>, <i>harto<\/i>, <i>mañana<\/i>, <i>hasta<\/i>, <i>bien… bien<\/i> y <i>hacia<\/i>. Y el reparto de las respuestas oficiales: <b>adverbio en diez de los doce<\/b>, conjunción en uno (<i>bien… bien<\/i>) y preposición en otro (<i>hacia<\/i>). Los dos casos que no son adverbio son justo los que están puestos para separar a quien ha estudiado, así que la cuenta no sustituye al método. Sirve para lo otro: si se han aplicado las tres preguntas de la prueba de bolsillo y sigue la duda entre adverbio y otra clase, se marca adverbio.<\/p>\n\n<h3>Las tres fronteras que el examen explota<\/h3>\n<p><b>Adverbio o conjunción.<\/b> El adverbio modifica y no une; la conjunción une dos elementos del mismo rango. Si la palabra se puede sustituir por <i>o<\/i>, <i>y<\/i>, <i>pero<\/i> o <i>aunque<\/i> sin que la oración se rompa, es conjunción: «bien por correo, bien por teléfono» admite «o por correo, o por teléfono».<\/p>\n<p><b>Adverbio o preposición.<\/b> La preposición va delante de su complemento y forma grupo con él: <i>hacia el norte<\/i>, <i>hasta la puerta<\/i>. El adverbio añade énfasis y se puede quitar sin que falte nada: «Lo entiende <b>incluso<\/b> un niño» sigue siendo una oración completa sin <i>incluso<\/i>. La prueba de los dos: quítala. Si la oración se sostiene, es adverbio; si queda un hueco, es preposición. <i>Hacia<\/i> es el caso limpio de preposición, y está en la lista cerrada que hay que saber de memoria: <i>a, ante, bajo, con, contra, de, desde, durante, en, entre, hacia, hasta, mediante, para, por, según, sin, sobre, tras<\/i>.<\/p>\n<p><b>Adverbio o adjetivo.<\/b> El adjetivo concuerda con el sustantivo y cambia de forma —<i>una respuesta rápida<\/i>, <i>unas respuestas rápidas<\/i>—; el adverbio modifica al verbo y se queda igual pase lo que pase alrededor: <i>trabajan duro<\/i>, no ⊗<i>trabajan duros<\/i>; <i>están medio dormidas<\/i>, no ⊗<i>medias dormidas<\/i>. La prueba es ponerlo en plural: si la palabra tiene que cambiar, es adjetivo; si se queda como estaba, es adverbio.<\/p>\n\n<h3>Muy y mucho, y los adverbios en -mente<\/h3>\n<p><i>Muy<\/i> va delante de un adjetivo o de otro adverbio —<i>muy caro<\/i>, <i>muy lejos<\/i>—; <i>mucho<\/i> acompaña al verbo —<i>trabaja mucho<\/i>—. La excepción son los comparativos: delante de <i>mayor<\/i>, <i>menor<\/i>, <i>mejor<\/i> y <i>peor<\/i> se dice <i>mucho<\/i>, como en <i>mucho mejor<\/i>. Y cuando van dos adverbios en <i>-mente<\/i> seguidos, la terminación la lleva solo el segundo adverbio, y el anterior se queda en femenino singular: <i>habló clara y rápidamente<\/i>.<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "En el molde del examen: cuatro reales y ocho propios", "ayuda": "Doce ítems con cuatro opciones. Los cuatro con chapa de año son literales del examen, con sus opciones y su respuesta oficial; los ocho sin chapa están escritos en el mismo molde. En cada uno, aplica la prueba de bolsillo entera antes de elegir.", "items": [{"enun": "¿A qué categoría gramatical pertenece la palabra <i>ya<\/i> en la oración «Aquel director <b>ya<\/b> no quería ni oír los rumores de la orquesta»?", "conv": "2015s", "ops": ["Adverbio", "Pronombre", "Adjetivo", "Conjunción"], "sol": "Adverbio", "porque": "no cambia de forma, no lleva sustantivo al lado y no une nada: modifica a <i>quería<\/i> diciendo cuándo"}, {"enun": "¿Qué clase de palabra es <i>aun<\/i> en la oración «A veces, <b>aun<\/b> queriendo solucionar los problemas del inversor, no pueden hacerlo por falta de recursos»?", "conv": "2017t", "ops": ["Preposición", "Adverbio", "Conjunción", "Adjetivo"], "sol": "Adverbio", "porque": "equivale a <i>incluso<\/i>: «incluso queriendo solucionarlo»"}, {"enun": "Indique cuál es la categoría gramatical de <i>aun<\/i> en la siguiente oración: «Con disciplina se puede crear un estado de relajación en el que es posible soñar <b>aun<\/b> despierto».", "conv": "2017s", "ops": ["Adverbio", "Pronombre", "Conjunción", "Adjetivo"], "sol": "Adverbio", "porque": "la misma equivalencia, «soñar incluso despierto»: el tribunal preguntó <i>aun<\/i> dos veces en dos oraciones distintas y la respuesta fue la misma las dos veces"}, {"enun": "Indique la categoría gramatical de <i>bien<\/i> en la siguiente oración: «En breve nos comunicaremos con usted, <b>bien<\/b> por correo, <b>bien<\/b> por teléfono».", "conv": "2018t", "ops": ["Adjetivo", "Adverbio", "Conjunción", "Preposición"], "sol": "Conjunción", "porque": "viene repetido y por parejas, presentando dos alternativas, y se puede cambiar por <i>o… o<\/i>: «o por correo, o por teléfono». Es el único caso de los doce en que la respuesta obvia falla"}, {"enun": "¿Qué clase de palabra es <i>alguien<\/i> en la oración «¿Ha llamado <b>alguien<\/b> esta mañana?»?", "ops": ["Pronombre", "Determinante", "Adverbio", "Sustantivo"], "sol": "Pronombre", "porque": "va solo, ocupa el sitio de un sustantivo y hace de sujeto de <i>ha llamado<\/i>"}, {"enun": "Indique la categoría gramatical de <i>entre<\/i> en la oración «Nos vemos <b>entre<\/b> semana».", "ops": ["Adverbio", "Conjunción", "Preposición", "Determinante"], "sol": "Preposición", "porque": "va delante de su complemento, <i>semana<\/i>, y forma grupo con él; quitarla deja un hueco"}, {"enun": "¿A qué categoría gramatical pertenece <i>cerca<\/i> en la oración «La parada queda <b>cerca<\/b>»?", "ops": ["Adverbio", "Preposición", "Adjetivo", "Sustantivo"], "sol": "Adverbio", "porque": "dice dónde queda la parada, no lleva complemento detrás y no cambia de forma"}, {"enun": "¿Qué clase de palabra es <i>hacia<\/i> en la oración «Salió <b>hacia<\/b> la estación a las seis»?", "ops": ["Adverbio", "Conjunción", "Adjetivo", "Preposición"], "sol": "Preposición", "porque": "lleva detrás su complemento, <i>la estación<\/i>, y está en la lista cerrada"}, {"enun": "Indique la categoría gramatical de <i>varios<\/i> en la oración «Cambiaron <b>varios<\/b> contadores del edificio».", "ops": ["Pronombre", "Determinante", "Adjetivo", "Adverbio"], "sol": "Determinante", "porque": "acompaña a <i>contadores<\/i> y concuerda con él en masculino plural; solo, sin sustantivo, sería pronombre"}, {"enun": "¿Qué clase de palabra es <i>mañana<\/i> en la oración «<b>Mañana<\/b> firmamos el contrato»?", "ops": ["Adverbio", "Sustantivo", "Adjetivo", "Preposición"], "sol": "Adverbio", "porque": "dice cuándo se firma y no cambia de forma; como sustantivo llevaría determinante, <i>la mañana del lunes<\/i>"}, {"enun": "Indique la categoría gramatical de <i>harto<\/i> en la oración «Estaba <b>harto<\/b> de pagar dos alquileres».", "ops": ["Adverbio", "Determinante", "Adjetivo", "Pronombre"], "sol": "Adjetivo", "porque": "cambia de género y de número —<i>harta<\/i>, <i>hartos<\/i>— y dice cómo estaba el sujeto"}, {"enun": "¿A qué categoría gramatical pertenece <i>rápido<\/i> en la oración «Conduce <b>rápido<\/b> cuando llega tarde»?", "ops": ["Adjetivo", "Sustantivo", "Determinante", "Adverbio"], "sol": "Adverbio", "porque": "modifica a <i>conduce<\/i> y se queda igual con otro sujeto: <i>conducen rápido<\/i>, no ⊗<i>rápidos<\/i>"}], "criterio": "Seis de las doce respuestas son <i>adverbio<\/i>, y en el examen real son diez de doce. Las otras seis están puestas para lo que el tribunal hace con <i>bien… bien<\/i> y con <i>hacia<\/i>: comprobar que se ha mirado la oración y no la palabra. La posición de la respuesta no significa nada, y los dos ítems reales de <i>aun<\/i> lo muestran: la misma respuesta está en la b) en uno y en la a) en el otro.", "apoyo": ["Las diez palabras del censo", "Las tres fronteras que el examen explota"]}, {"tipo": "hueco", "titulo": "La misma palabra, dos clases", "ayuda": "Ocho oraciones, por parejas: la misma palabra en negrita con dos clases distintas. Escribe el nombre de la clase.", "items": [{"enun": "Trabaja <b>bien<\/b> con los compañeros.", "sol": "adverbio", "porque": "dice cómo trabaja y no cambia de forma"}, {"enun": "Iremos <b>bien<\/b> en tren, <b>bien<\/b> en autobús.", "sol": "conjunción", "porque": "por parejas, presentando dos alternativas: se cambia por <i>o… o<\/i>"}, {"enun": "Es un trabajo <b>duro<\/b>.", "sol": "adjetivo", "porque": "concuerda con <i>trabajo<\/i>: <i>unos trabajos duros<\/i>"}, {"enun": "Aquí se trabaja <b>duro<\/b>.", "sol": "adverbio", "porque": "modifica al verbo y no cambia: <i>aquí trabajan duro<\/i>"}, {"enun": "Metió la carta en el <b>sobre<\/b>.", "sol": "sustantivo", "porque": "lleva artículo delante y admite plural, <i>los sobres<\/i>"}, {"enun": "Dejó las llaves <b>sobre<\/b> la mesa.", "sol": "preposición", "porque": "va delante de su complemento, <i>la mesa<\/i>, y está en la lista cerrada"}, {"enun": "Hoy el cielo está <b>claro<\/b>.", "sol": "adjetivo", "porque": "concuerda con <i>cielo<\/i>: <i>una tarde clara<\/i>"}, {"enun": "Habla <b>claro<\/b> cuando explica.", "sol": "adverbio", "porque": "dice cómo habla y se queda igual con sujeto femenino: <i>ella habla claro<\/i>"}], "criterio": "Cuatro palabras y ocho clases, y en cada pareja la clase la fija lo que la palabra tiene al lado: con <i>bien<\/i> y con <i>duro<\/i> se decide con la sustitución y el plural; con <i>sobre<\/i>, con el artículo delante o el complemento detrás. Escribir el nombre de la clase se corrige con la ortografía delante: <i>preposición<\/i> y <i>conjunción<\/i> llevan tilde, y <i>adjetivo<\/i> no.", "apoyo": ["Las tres fronteras que el examen explota"]}, {"tipo": "hueco", "titulo": "Muy o mucho", "ayuda": "Seis frases. Escribe la palabra que falta: <i>muy<\/i> delante de adjetivo o adverbio, <i>mucho<\/i> con el verbo y delante de los comparativos.", "items": [{"enun": "Está ______ cansado después del turno.", "sol": "muy", "porque": "delante del adjetivo <i>cansado<\/i>"}, {"enun": "Trabaja ______ desde que cambió de empresa.", "sol": "mucho", "porque": "acompaña al verbo <i>trabaja<\/i>"}, {"enun": "El piso nuevo está ______ mejor situado.", "sol": "mucho", "porque": "delante del comparativo <i>mejor<\/i>"}, {"enun": "Vive ______ lejos de la parada.", "sol": "muy", "porque": "delante del adverbio <i>lejos<\/i>"}, {"enun": "Tiene ______ trabajo esta semana.", "sol": "mucho", "porque": "acompaña al sustantivo <i>trabajo<\/i> y concuerda con él: <i>mucha faena<\/i>"}, {"enun": "Duerme ______ poco entre turno y turno.", "sol": "muy", "porque": "delante del adverbio <i>poco<\/i>"}], "criterio": "Las seis se deciden por la palabra que viene detrás. La que más se falla es la del comparativo: ⊗<i>muy mejor<\/i> es una falta en la redacción, y se escribe <i>mucho mejor<\/i> porque <i>mejor<\/i> ya lleva dentro el <i>más<\/i>.", "apoyo": ["Muy y mucho, y los adverbios en -mente"]}, {"tipo": "abierta", "titulo": "Explícalo con la prueba", "ayuda": "Dos o tres líneas por pregunta. Nombra la prueba que decide y aplícala a las dos oraciones.", "items": [{"enun": "¿Por qué <i>bien<\/i> es conjunción en «bien por correo, bien por teléfono» y adverbio en «trabaja bien»?", "modelo": "En «trabaja bien» la palabra modifica al verbo y dice cómo se trabaja; se puede quitar y la oración sigue en pie: adverbio. En «bien por correo, bien por teléfono» viene repetida y por parejas, uniendo dos alternativas del mismo rango, y admite el cambio por <i>o… o<\/i> —«o por correo, o por teléfono»— sin que la oración se rompa: conjunción. La prueba es la sustitución por otra conjunción."}, {"enun": "En «Lo entiende <i>incluso<\/i> quien no ha estudiado nunca», ¿cómo decides entre adverbio y preposición?", "modelo": "Quitándola. «Lo entiende quien no ha estudiado nunca» es una oración completa, así que <i>incluso<\/i> solo añadía énfasis: adverbio. Una preposición no se puede quitar, porque deja a su complemento sin enganche: en «Salió hacia la estación», quitar <i>hacia<\/i> deja «Salió la estación», que no se sostiene."}], "criterio": "Una explicación completa nombra la prueba —la sustitución o la supresión—, la aplica a las dos oraciones y dice qué resultado da en cada una. La que solo dice «una une y la otra no» repite la definición sin comprobarla sobre la oración.", "apoyo": ["Las tres fronteras que el examen explota"]}]}], "pie": "Ejercicios del curso de PAU +25 del CFA L'Alzina de Cerdanyola, 2026-27. Las palabras y los enunciados marcados con un año están tomados de las <i>Proves d'accés a la universitat per a més grans de 25 anys<\/i> de la Generalitat de Catalunya, documentos públicos, y las respuestas proceden de sus criterios oficiales de corrección. El texto del carril B está inventado para practicar.", "revision": "2026-09-15"};</script>
<script>
/* Motor de ejercicios · PAU +25 Castellà 26-27
   Formato de estado compatible con castellano 2:
   {unidad, fecha, estado:{ "n": {v:{}, r:{}, hecho, aciertos, total, mejor} }} */
(function () {
  'use strict';

  var DIA = window.DIA;
  /* La llave lleva la materia delante. Las páginas de CAS y las de PAU +25 se
     sirven desde el mismo sitio —oscaralejandrobanos.github.io/2026/—, así que
     comparten localStorage: con una llave común, el día 3 de CAS y el día 3 de
     PAU se pisarían el progreso el uno al otro. */
  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');
  var estado = {};
  var ejercicios = [];

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */
      .replace(/\s+/g, ' ').trim();
  }
  /* la letra del ítem. Antes era una tabla de doce y el ítem 13 salía «undefined» */
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function letra(i) { return i < AB.length ? AB[i] : String(i + 1); }
  function el(t, cls, txt) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (txt != null) n.innerHTML = txt;
    return n;
  }
  function aviso(txt) {
    var a = document.getElementById('aviso');
    a.textContent = txt; a.classList.add('on');
    clearTimeout(aviso._t);
    aviso._t = setTimeout(function () { a.classList.remove('on'); }, 2100);
  }
  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {
      if (!negado(t.slice(0, m.index))) return true;
      re.lastIndex = m.index + 1;
    }
    return false;
  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La
     comprobación sigue siendo orientativa —busca conceptos, no entiende la
     frase—, y la página lo dice junto al ejercicio. */

      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', null, c.teoria);
        t.querySelectorAll('table').forEach(function (tb) {
          var w = el('div', 'tabla-scroll');
          tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
        });
        sec.appendChild(t);
      }
      (c.ejercicios || []).forEach(function (ej) {
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        if (c.lectura) {
          /* las preguntas van sobre el texto: se abre encima, sin perder el sitio */
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = sec.querySelector('.lectura').cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', c.lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
</html>
