<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Día 11 · PAU +25</title>
<style>
:root{
  --tinta:#1b1a17; --tinta2:#44403a; --tinta3:#6b655c;
  --fondo:#faf8f4; --papel:#fff; --linea:#e3ded4;
  --acento:#8a3324; --acento2:#f4ece4;
  --bien:#2f6b45; --bienf:#e8f3ec;
  --mal:#a33b2a; --malf:#fbecea;
  --medio:#946200; --mediof:#fdf3e0;
  --r:10px; --sombra:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --tinta:#efeae2; --tinta2:#c6bfb4; --tinta3:#9c9489;
    --fondo:#16150f; --papel:#1f1e18; --linea:#33312a;
    --acento:#e0866f; --acento2:#2a231f;
    --bien:#7fc79b; --bienf:#1c2a22;
    --mal:#e29184; --malf:#2c1e1b;
    --medio:#d9ac5a; --mediof:#2a2317;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.65 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%}
/* texto alineado a la izquierda: en pantalla la justificación abre ríos y la partición de palabras depende del navegador */
.env{max-width:860px;margin:0 auto;padding:0 18px 90px}

/* cabecera */
/* vuelta al indice del sitio: sin esto las paginas de dia quedan sueltas */
.volver{margin:0 0 14px;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.volver a{display:inline-block;color:var(--tinta3);text-decoration:none;
  border:1px solid var(--linea);border-radius:100px;padding:7px 13px 7px 10px;
  background:var(--papel);transition:border-color .13s,color .13s}
.volver a::before{content:"← "}
.volver a:hover,.volver a:focus-visible{color:var(--acento);border-color:var(--acento);outline:0}
@media print{.volver{display:none}}
header.top{padding:26px 0 20px;border-bottom:2px solid var(--tinta);margin-bottom:26px}
.kicker{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:10px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tinta2);margin:0;font-size:14px}

/* carriles */
.carril{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:22px 22px 8px;margin:0 0 24px;box-shadow:var(--sombra)}
.carril>h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapa{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  background:var(--acento);color:#fff;padding:5px 9px;border-radius:100px;white-space:nowrap}
.carril>.meta{color:var(--tinta3);font-size:13px;margin:0 0 18px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
/* de donde sale el carril en el dossier de papel, con su pagina */
.carril>.cuaderno{font-size:13px;color:var(--tinta2);background:var(--acento2);
  border-left:3px solid var(--acento);border-radius:0 6px 6px 0;
  padding:9px 13px;margin:-8px 0 18px;line-height:1.5}
.carril>.cuaderno b{color:var(--acento)}
@media print{.carril>.cuaderno{background:transparent;border-left-color:var(--linea)}}

/* teoría */
.nota{background:var(--acento2);border-left:3px solid var(--acento);
  padding:13px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px}
.nota p:first-child{margin-top:0}.nota p:last-child{margin-bottom:0}
.nota b,.nota strong{color:var(--acento)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
th,td{border:1px solid var(--linea);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--acento2);font-weight:600;font-size:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.02em}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ejercicio: cada uno arranca con una regla que se ve, del color del acento al del papel */
.ej{position:relative;margin-top:30px;padding:26px 0 6px}
.ej::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--acento) 0,var(--acento) 34px,color-mix(in srgb,var(--acento) 45%,var(--linea)) 160px,var(--linea) 100%)}
.ej-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:6px}
.num{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--acento);color:#fff;
  display:grid;place-items:center;font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;margin-top:0}
.ej-t{flex:1;font-weight:700;font-size:16px;padding-top:3px}
/* los iconos de cada ejercicio: texto y teoría, en una pseudoventana */
.ej-icos{flex:0 0 auto;display:flex;gap:6px;align-self:flex-start}
.ej-ico{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);background:var(--fondo);border:1px solid var(--linea);border-radius:100px;
  padding:6px 10px 6px 8px;cursor:pointer;transition:border-color .13s,color .13s,background .13s}
.ej-ico svg{flex:0 0 auto}
.ej-ico:hover,.ej-ico:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
@media(max-width:560px){.ej-ico span{display:none}.ej-ico{padding:7px}}
/* la pseudoventana */
.velo{position:fixed;inset:0;z-index:40;background:rgba(20,18,12,.46);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .18s}
.velo.on{opacity:1}
.velo[hidden]{display:none}   /* el atributo hidden pierde contra display:flex si no se dice aquí */
.ventana{background:var(--papel);color:var(--tinta);width:min(780px,100%);max-height:min(86vh,900px);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(8px) scale(.985);transition:transform .18s}
.velo.on .ventana{transform:none}
.v-cab{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 14px 24px;border-bottom:1px solid var(--linea);
  background:var(--papel)}
.v-txt{flex:1;min-width:0}
.v-k{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:7px}
.v-cab h2{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.v-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);background:var(--fondo);
  color:var(--tinta2);display:grid;place-items:center;cursor:pointer;margin:-4px -4px 0 0}
.v-x:hover,.v-x:focus-visible{border-color:var(--acento);color:var(--acento);outline:0}
.v-cuerpo{overflow:auto;padding:6px 24px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ventana::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--papel));transition:opacity .2s}
.ventana{position:relative}
.ventana.sigue::after{opacity:1}
.v-cuerpo .lectura{margin:14px 0 0;border:0;padding:0;background:transparent}
.v-bloque>h3:first-child{margin-top:18px}
.v-bloque>p:first-child{margin-top:16px}
details.v-todo{margin-top:22px;border-top:1px solid var(--linea);padding-top:8px}
details.v-todo>summary{cursor:pointer;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);
  padding:8px 0;list-style:none;user-select:none}
details.v-todo>summary::-webkit-details-marker{display:none}
details.v-todo>summary::before{content:"▸ ";color:var(--acento)}
details.v-todo[open]>summary::before{content:"▾ "}
details.v-todo>summary:hover{color:var(--tinta)}
body.con-ventana{overflow:hidden}
@media(max-width:560px){
  .velo{padding:0;align-items:stretch}
  .ventana{width:100%;max-height:none;height:100%;border-radius:0}
  .v-cab{padding:14px 14px 12px 18px}
  .v-cuerpo{padding:4px 18px 28px}
}
@media(prefers-reduced-motion:reduce){.velo,.ventana{transition:none}}
nav.carriles{position:sticky;top:0;z-index:20;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:0 0 6px;background:var(--fondo);border-bottom:1px solid var(--linea)}
@media(max-width:560px){nav.carriles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px 6px;padding:8px 18px}
  nav.carriles::-webkit-scrollbar{display:none} nav.carriles a{white-space:nowrap;flex:0 0 auto}}
nav.carriles a{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);text-decoration:none;border:1px solid var(--linea);border-radius:100px;padding:7px 11px;background:var(--fondo)}
nav.carriles a:hover{border-color:var(--acento);color:var(--acento)}
.carril{scroll-margin-top:52px}.lectura{scroll-margin-top:52px}
.ej-ayuda{color:var(--tinta2);font-size:14px;margin:2px 0 12px 37px}
.items{margin-left:37px}
@media(max-width:560px){.ej-ayuda,.items{margin-left:0}}

.item{padding:9px 0;border-bottom:1px dotted var(--linea)}
.item:last-child{border-bottom:0}
.item-l{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.letra{color:var(--tinta2);font-weight:700;min-width:22px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;font-size:13px}
.enun{flex:1;min-width:180px}
.conv{font:700 11px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;letter-spacing:.06em;
  color:var(--acento);background:var(--acento2);padding:3px 7px;border-radius:100px;white-space:nowrap}

input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--tinta);
  background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:7px 10px;
  transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=text]{width:190px}
input[type=text].corto{width:120px}
textarea{width:100%;min-height:74px;resize:vertical;line-height:1.55;margin-top:7px}
textarea.larga{min-height:150px}
.cuenta{font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin:4px 0 2px;text-align:right}
.cuenta.fuera{color:var(--mal)}
select{width:auto;min-width:150px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 16%,transparent)}
.ok input,.ok textarea,.ok select{border-color:var(--bien);background:var(--bienf)}
.ko input,.ko textarea,.ko select{border-color:var(--mal);background:var(--malf)}
.medio input,.medio textarea{border-color:var(--medio);background:var(--mediof)}

/* opciones */
.ops{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.op{font:inherit;font-size:14px;padding:6px 13px;border:1px solid var(--linea);
  background:var(--fondo);color:var(--tinta);border-radius:100px;cursor:pointer;
  transition:all .13s}
.op:hover{border-color:var(--acento)}
.op[aria-pressed=true]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.ok .op[aria-pressed=true]{background:var(--bien);border-color:var(--bien);color:#fff}
.ko .op[aria-pressed=true]{background:var(--mal);border-color:var(--mal);color:#fff}

/* veredicto por ítem */
.dice{font-size:13px;margin:7px 0 0;padding:7px 11px;border-radius:7px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.5}
.dice.b{background:var(--bienf);color:var(--bien)}
.dice.m{background:var(--malf);color:var(--mal)}
.dice.h{background:var(--mediof);color:var(--medio)}
.dice b{font-weight:700}

/* botonera */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 6px 37px}
@media(max-width:560px){.bar{margin-left:0}}
button.acc{font:700 13px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:9px 17px;border-radius:100px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--fondo);cursor:pointer;transition:opacity .13s}
button.acc:hover{opacity:.84}
button.gh{background:transparent;color:var(--tinta2);border-color:var(--linea)}
button.gh:hover{color:var(--tinta);border-color:var(--tinta2)}
.marca{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);margin-left:auto}
.marca .mejor{color:var(--acento)}

/* solución desplegable */
details.sol{margin:12px 0 0 37px;border:1px solid var(--linea);border-radius:8px;
  background:var(--fondo);overflow:hidden}
@media(max-width:560px){details.sol{margin-left:0}}
details.sol>summary{cursor:pointer;padding:9px 14px;font:700 12px/1.4 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;
  color:var(--tinta2);list-style:none;user-select:none}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸ ";color:var(--acento)}
details.sol[open]>summary::before{content:"▾ "}
details.sol>summary:hover{color:var(--tinta)}
.sol-c{padding:2px 14px 14px;font-size:14px;border-top:1px solid var(--linea)}
.sol-c p:first-child{margin-top:11px}
.crit{background:var(--acento2);border-left:3px solid var(--acento);padding:10px 13px;
  border-radius:0 7px 7px 0;margin:11px 0;font-size:14px}
.crit b:first-child{color:var(--acento)}
.modelo{border-left:2px solid var(--linea);padding:2px 0 2px 13px;margin:9px 0;color:var(--tinta2);font-style:italic}

/* pie / progreso */
.pie{position:sticky;bottom:0;background:color-mix(in srgb,var(--fondo) 94%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:11px 18px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;z-index:9;margin-top:26px}
.pie .env2{max-width:860px;margin:0 auto;width:100%;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.barra{flex:1;min-width:110px;height:7px;background:var(--linea);border-radius:100px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .35s}
.pie .txt{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;color:var(--tinta2);white-space:nowrap}
.pie button{font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;padding:7px 12px;border-radius:100px;
  border:1px solid var(--linea);background:transparent;color:var(--tinta2);cursor:pointer}
.pie button:hover{color:var(--tinta);border-color:var(--tinta2)}

footer.fin{margin-top:30px;padding-top:18px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:13px;font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;line-height:1.6}

.aviso{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);
  background:var(--tinta);color:var(--fondo);padding:11px 19px;border-radius:100px;
  font:700 12px/1 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.19)}
.aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .pie,.bar,.aviso,nav.carriles,.ej-icos,.velo,.cuenta{display:none!important}
  .ej::before{background:#999}
  textarea{min-height:120px;border:1px solid #bbb}
  .ej,.lectura{break-inside:avoid}
  body{background:#fff}
  .carril{break-inside:avoid;box-shadow:none;border-color:#ccc}
  details.sol{display:none}
}

/* cazar faltas */
.caza{margin-top:9px;line-height:1.95;font-size:15px}
.tk{cursor:pointer;padding:2px 3px;border-radius:5px;border-bottom:2px solid transparent;
  transition:background .12s,border-color .12s}
.tk:hover{background:var(--acento2)}
.tk.sel{background:var(--acento2);border-bottom-color:var(--acento);font-weight:600}
.tk.bien{background:var(--bienf);border-bottom-color:var(--bien);color:var(--bien);font-weight:600}
.tk.perdida{background:var(--malf);border-bottom-color:var(--mal);color:var(--mal);font-weight:600}
.tk.sobra{background:var(--mediof);border-bottom-color:var(--medio);color:var(--medio)}
.ok .caza .tk,.ko .caza .tk,.medio .caza .tk{cursor:default}

/* el texto de partida del carril B, en el formato de la prueba */
.lectura{border:1px solid var(--linea);border-radius:8px;padding:17px 19px;
  margin:18px 0 22px;background:var(--fondo)}
.lec-t{font-weight:700;font-size:16px;margin-bottom:3px}
.lec-f{color:var(--tinta3);font-size:13px;margin-bottom:13px;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-c{font-size:15px;line-height:1.75}
.lec-l{display:flex;gap:11px;align-items:baseline}
.lec-n{flex:0 0 22px;text-align:right;color:var(--tinta3);user-select:none;
  border-right:1px solid var(--linea);padding-right:9px;
  font:400 11px/1.75 Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
.lec-x{flex:1;text-align:left;hyphens:none}
.lec-l.blanco{height:9px}
/* el pie de la lectura termina con el nombre del cuadernillo oficial
   —Examenes/2016_general_llengua_castellana_titular.pdf—, que no tiene por
   donde partirse: sin esto mide 425 px y en un movil de 390 desplaza de lado
   la pagina entera */
.lec-p{color:var(--tinta3);font-size:13px;margin-top:14px;text-align:right;
  overflow-wrap:anywhere;
  font-family:Verdana,"DejaVu Sans",Geneva,Tahoma,sans-serif}
@media(max-width:560px){.lec-c{font-size:14px}.lec-n{flex-basis:17px}}

</style>
</head>
<body>
<div class="env">
  <header class="top">
    <p class="volver"><a href="../pau-trimestres.html#sesion/2026-11-03">Volver a la sesión</a></p>
    <div class="kicker">PAU +25 · primer trimestre</div>
    <h1>Martes 3 de noviembre</h1>
    <p class="sub">Corregir lo que escribes y la lista de diez · Las tres bodas de Manolita (2017s), la tercera redacción corta y los argumentos a favor y en contra · la tanda de figuras</p>
  </header>
</div>
<div class="pie">
  <div class="env2">
    <span class="txt" id="progtxt">—</span>
    <span class="barra"><i></i></span>
    <button type="button" id="bexp">Guardar progreso</button>
    <button type="button" id="bimp">Cargar</button>
    <button type="button" id="bres">Borrar</button>
  </div>
</div>
<div class="aviso" id="aviso"></div>
<script>window.DIA = {"dia": 11, "fecha": "2026-11-03", "tab": "Día 11 · PAU +25", "kicker": "PAU +25 · primer trimestre", "h1": "Martes 3 de noviembre", "sub": "Corregir lo que escribes y la lista de diez · Las tres bodas de Manolita (2017s), la tercera redacción corta y los argumentos a favor y en contra · la tanda de figuras", "carriles": [{"chapa": "Carril A", "titulo": "Corregir lo que escribes: la relectura en tres pasadas y tu lista de diez", "meta": "20 minutos · la relectura que busca una sola clase de falta cada vez; la lista de diez se abre hoy", "teoria": "<p>Las letras y las palabras que se separan ya están dadas; hoy se da el procedimiento para cazarlas en el propio texto antes de entregarlo. Releer buscando «cualquier falta» no funciona, porque el ojo lee lo que espera leer y pasa por encima de <i>estava<\/i> igual que por encima de <i>estaba<\/i>. La relectura que funciona busca <b>una sola clase de falta en cada pasada<\/b>, y dura tres minutos en total: los tres que el plan de la redacción reserva al final.<\/p>\n\n<h3>La relectura de tres minutos<\/h3>\n<table>\n<tr><th>pasada<\/th><th>qué buscas<\/th><th>tiempo<\/th><\/tr>\n<tr><td><b>1<\/b><\/td><td>los <b>verbos<\/b>: imperfectos en <i>-aba<\/i>, infinitivos en <i>-bir<\/i>, pretéritos con j (<i>dije, trajo, condujo<\/i>), las formas de <i>haber<\/i><\/td><td>1 min<\/td><\/tr>\n<tr><td><b>2<\/b><\/td><td>las palabras de <b>tu lista de diez<\/b><\/td><td>1 min<\/td><\/tr>\n<tr><td><b>3<\/b><\/td><td>la <b>palabra dudosa<\/b>: si no sabes cómo se escribe, sustitúyela<\/td><td>1 min<\/td><\/tr>\n<\/table>\n<p>La pasada de los verbos va delante porque ahí se concentran las faltas de letra de una redacción de adulto: el imperfecto, el pretérito con j y las formas de <i>haber<\/i> cubren la mayoría de las que aparecen en las devoluciones de este curso. En la pasada de la palabra dudosa, primero se prueba a resolverla con una regla de las del 22 de octubre —la de <i>-aba<\/i>, la de <i>-aje<\/i>, la de <i>m<\/i> antes de <i>b<\/i>—; si ninguna la cubre, se busca otra manera de decir lo mismo. Sustituir <i>absorbió<\/i> por <i>compró<\/i> conserva el sentido; sustituirlo por <i>cogió<\/i> lo pierde, y la palabra vaga se nota en la lectura igual que la falta. Suele funcionar mejor cambiar la construcción de la frase que buscar otra palabra suelta.<\/p>\n\n<h3>Tu lista de diez<\/h3>\n<p>Se abre hoy y se cierra el día del examen. Es una lista de diez palabras, ni una más: <b>las que tú has escrito mal en tus propios textos<\/b> —la redacción del 20 de octubre, las microtareas del 8 y del 22, la del 29—, no las que se te puedan olvidar. Cada devolución añade las que hayan salido y quita las que ya no falles. La lista de otro no sirve, porque cada uno falla en su sitio, y en la segunda pasada de los tres minutos se buscan solo esas diez.<\/p>\n<p>Un aviso sobre <i>solo<\/i>: desde 2010 se escribe sin tilde, y la Ortografía solo la admite cuando hay ambigüedad; ninguno de los textos de examen de 2015-2026 lo escribe con tilde.<\/p>", "ejercicios": [{"tipo": "cazar", "titulo": "Pasada 1: los verbos", "ayuda": "Un fragmento de redacción con faltas en los verbos. Seis palabras están mal escritas: márcalas. Dos verbos que parecen faltas están bien.", "items": [{"texto": "Cuando llegué al taller, el encargado estava hablando por teléfono y me dijo que esperara. Mientras esperaba, vi que los mecánicos habían empezado a hervir agua para el café y que alguien trajo los repuestos que faltaban. Al final me atendió, pero no quiso recivir el coche sin la documentación: dijo que el seguro le prohivió aceptar reparaciones si no le trajieran la póliza, y que la última vez ya le abían devuelto una factura por eso. Me fui pensando que devía haber llamado antes.", "faltas": {"estava": "estaba: imperfecto en -aba, con b", "recivir": "recibir: los verbos en -bir llevan b", "prohivió": "prohibió: de <i>prohibir<\/i>, verbo en -bir", "trajieran": "trajeran: el pretérito con j no lleva i delante de la e", "abían": "habían: forma de <i>haber<\/i>, con h", "devía": "debía: imperfecto en -ía de <i>deber<\/i>, y <i>deber<\/i> se escribe con b"}}], "criterio": "Las seis se cazan con la primera pasada, porque las seis están en verbos: dos imperfectos, dos verbos en <i>-bir<\/i>, un pretérito con j y una forma de <i>haber<\/i>. Los dos señuelos son <i>hervir<\/i>, que es una de las tres excepciones de <i>-bir<\/i>, y <i>trajo<\/i>, que es la forma correcta del pretérito con j.", "apoyo": ["La relectura de tres minutos"]}, {"tipo": "clasificar", "titulo": "Pasada 3: ¿la cubre una regla o se sustituye?", "ops": ["-aba", "-bir", "m antes de b", "-aje", "pretérito con j", "se sustituye"], "ayuda": "Ocho dudas de relectura. Indica qué regla del 22 de octubre resuelve cada una —la de <i>-aba<\/i>, la de <i>-bir<\/i>, la de <i>m<\/i> antes de <i>b<\/i>, la de <i>-aje<\/i>, la del pretérito con j— o si no la cubre ninguna y hay que sustituir la palabra.", "items": [{"enun": "¿<i>hervía<\/i> o <i>herbía<\/i>?", "sol": "-bir", "porque": "<i>hervir<\/i> es una de las tres excepciones de la regla, y por eso va con v"}, {"enun": "¿<i>exhibía<\/i> o <i>exivía<\/i>?", "sol": "se sustituye", "porque": "ni la h ni la b de <i>exhibir<\/i> tienen regla: <i>enseñaba<\/i>, <i>presentaba<\/i>"}, {"enun": "¿<i>cantaba<\/i> o <i>cantava<\/i>?", "sol": "-aba", "porque": "el imperfecto de la primera conjugación va con b"}, {"enun": "¿<i>trajeron<\/i> o <i>trajieron<\/i>?", "sol": "pretérito con j", "porque": "el pretérito con j no lleva i delante de la e"}, {"enun": "¿<i>absorbió<\/i> o <i>absorvió<\/i>?", "sol": "se sustituye", "porque": "la segunda b no la cubre ninguna regla de la tabla: <i>compró<\/i>, <i>se quedó con<\/i>"}, {"enun": "¿<i>garaje<\/i> o <i>garage<\/i>?", "sol": "-aje", "porque": "-aje va con j"}, {"enun": "¿<i>ambiente<\/i> o <i>anbiente<\/i>?", "sol": "m antes de b", "porque": "delante de b va siempre m"}, {"enun": "¿<i>recibir<\/i> o <i>recivir<\/i>?", "sol": "-bir", "porque": "los verbos en -bir llevan b"}], "criterio": "Cinco de las ocho las resuelve una regla de la tabla del 22 de octubre, y <i>hervía<\/i> también, por la lista de excepciones. Las dos que no cubre ninguna regla se sustituyen por otra palabra igual de exacta: <i>compró<\/i> conserva el sentido de <i>absorbió<\/i> y <i>cogió<\/i> no.", "apoyo": ["La relectura de tres minutos"]}, {"tipo": "abierta", "titulo": "Pasada 3: sustituye la palabra dudosa", "ayuda": "Tres frases con una palabra en cursiva de la que se duda. Escribe la frase con otra palabra o con otra construcción que signifique lo mismo y no lleve b/v, h ni j/g.", "items": [{"enun": "«Es un sector en <i>auge<\/i>.»", "modelo": "«Es un sector en crecimiento», «es un sector que crece». <i>Que sube<\/i> también sirve; <i>que va bien<\/i> pierde precisión."}, {"enun": "«<i>Exhibía<\/i> los resultados en cada reunión.»", "modelo": "«Enseñaba los resultados en cada reunión», «presentaba los resultados». <i>Sacaba<\/i> cambia el sentido."}, {"enun": "«El ayuntamiento ha <i>rehabilitado<\/i> el edificio.»", "modelo": "«El ayuntamiento ha reformado el edificio», «ha arreglado el edificio». <i>Ha hecho obras en<\/i> también conserva el sentido con otra construcción."}], "criterio": "Se da por buena la frase que conserva el sentido y no pierde precisión. Sustituir por una palabra vaga —<i>hacer<\/i>, <i>cosa<\/i>, <i>ir bien<\/i>— evita la falta de letra y deja la frase menos exacta, y esa imprecisión también la anota el corrector.", "apoyo": ["La relectura de tres minutos"]}, {"tipo": "abierta", "titulo": "Tu lista de diez: la primera versión", "ayuda": "Escribe las palabras que te han marcado como falta en la redacción del 20 de octubre y en las microtareas del 8, del 22 y del 29, una por línea. Si son menos de diez, la lista se queda corta: solo entran las que has escrito mal tú.", "items": [{"enun": "Tu lista de hoy.", "modelo": "Una lista de ejemplo: <i>a ver, había, sino, porque, dijeron, iba, hecho, también, garaje, recibir<\/i>. Todas salieron de las redacciones de quien la escribió; ninguna está por si acaso. En la segunda pasada de cada relectura se buscan estas diez y ninguna otra, y en cada devolución se tachan las que ya no fallan y se añaden las nuevas."}], "criterio": "La lista vale si cada palabra viene de una falta propia y marcada. Una lista de veinte palabras «difíciles» no sirve para la segunda pasada, porque en un minuto no se buscan veinte.", "apoyo": ["Tu lista de diez"]}], "cuaderno": {"libre": "repaso: la compactación del carril A dejó esta sesión sin materia nueva de ortografía, y se dedica a repasar la relectura de tres minutos del 29 de octubre y a abrir la lista de diez"}, "cuaderno_txt": "sesión libre: repaso: la compactación del carril A dejó esta sesión sin materia nueva de ortografía, y se dedica a repasar la relectura de tres minutos del 29 de octubre y a abrir la lista de diez"}, {"chapa": "Carril B", "titulo": "Las tres bodas de Manolita · la tercera redacción corta · devolución de a favor y en contra", "meta": "60 minutos · el texto de 2017s en el carril «El texto»; la redacción con el enunciado 2.2 de ese examen; lo que suele salir en la devolución de a favor y en contra", "teoria": "<p>Hoy se contesta el cuarto texto real, el fragmento de <i>Las tres bodas de Manolita<\/i> de Almudena Grandes, de la convocatoria de 2017 (tribunal especial): está más abajo, en el carril «El texto», con sus seis preguntas y la 2.1. Después se escribe la tercera redacción corta, con el enunciado 2.2 de ese mismo examen, y se devuelve la microtarea del jueves.<\/p>\n\n<h3>Lo que suele salir en la devolución de a favor y en contra<\/h3>\n<p>Tres marcas se repiten. <b>La razón doble<\/b>: las dos mitades llevan la misma razón vista desde los dos lados —«a favor: el uniforme ahorra dinero a las familias; en contra: el uniforme cuesta dinero a las familias»—, y las dos frases discuten el mismo dato, así que son una sola razón vista por dos lados. Se corrige cambiando de terreno —de fila en la tabla del 29 de octubre, o de dato—: si el a favor es empírico, el en contra sale de una analogía o de la experiencia propia. <b>El caso en lugar de la razón<\/b>: «en contra: mi sobrina odia el uniforme» cuenta lo que le pasa a una persona; se convierte en razón cuando se dice qué tiene de general, «obliga a llevar una ropa que muchos niños no elegirían». <b>La preferencia sin porqué<\/b>: «a favor: me parece bien» no da nada que un lector pueda discutir, y la mitad se queda sin puntuar.<\/p>\n\n<h3>Un enunciado que da el tema y no la pregunta<\/h3>\n<p>El 2.2 de 2017s pide: «Redacte un texto, de entre cincuenta y ochenta palabras, sobre la importancia del aspecto físico en la autoestima». No pregunta nada; da un tema. La tesis la pone quien escribe, y tiene que admitir la contraria: «el aspecto físico pesa en la autoestima más de lo que debería» se puede discutir; «el aspecto físico influye en la autoestima» no, porque nadie sostiene lo contrario, y una redacción que arranca así describe en lugar de argumentar. El texto de Almudena Grandes da el material del primer argumento —una narradora que se mide con su familia y con su hermana pequeña—, y el otro argumento se busca en otra fila de la tabla. La clave oficial de 2017 acompaña el enunciado con un modelo de sesenta palabras que expone la relación entre aspecto y autoestima sin defender nada; sirve para comprobar el registro y la extensión. La rúbrica del 20 de octubre pide además una idea desarrollada y los conectores que la enlazan, y eso se consigue con tesis y dos razones.<\/p>\n\n<h3>Devolución · un argumento a favor y otro en contra<\/h3>\n<p>Hoy se devuelve la redacción del martes y la microtarea es la 2.1 de 2026s: un argumento a favor y otro en contra de algo, en dos o tres líneas, por 1 punto.<\/p>\n\n<h3>De dónde se saca un argumento: los seis tipos<\/h3>\n<p>Quien se queda con un solo argumento suele estar buscando los dos en el mismo material. Hay seis maneras de fundamentar una postura, y cada una echa mano de algo distinto: un dato, la experiencia propia, lo que sostiene un especialista, un caso parecido, una idea que nadie discute o un sentimiento. La tabla las aplica a una misma tesis, «el tiempo de desplazamiento al trabajo debería contar como jornada», y así se comprueba que ninguna repite a las otras.<\/p>\n<table>\n<tr><th>tipo<\/th><th>se apoya en<\/th><th>sobre la tesis del desplazamiento<\/th><\/tr>\n<tr><td><b>empírico<\/b><\/td><td>un hecho comprobable; en el examen, los hechos comprobables están en el texto de partida<\/td><td>«Según los datos del texto, quien vive a más de veinte kilómetros dedica diez horas semanales al trayecto»<\/td><\/tr>\n<tr><td><b>de competencia<\/b><\/td><td>la experiencia de quien escribe, resumida en una línea<\/td><td>«Quien ha encadenado turnos con dos autobuses de por medio sabe que esas horas no se recuperan durmiendo»<\/td><\/tr>\n<tr><td><b>de autoridad<\/b><\/td><td>lo que sostiene un especialista; el más a mano es quien firma el texto de partida<\/td><td>«El autor del texto, que dirige un servicio de salud laboral, relaciona los trayectos largos con el sueño corto»<\/td><\/tr>\n<tr><td><b>analogía<\/b><\/td><td>un caso parecido que ya está resuelto de otra manera<\/td><td>«El tiempo que un electricista pasa yendo de un aviso a otro se paga desde hace años; el del trayecto de casa al trabajo, no»<\/td><\/tr>\n<tr><td><b>lugar común<\/b><\/td><td>una idea que acepta todo el mundo<\/td><td>«Nadie discute que el tiempo es lo único que no se recupera»: el más flojo de los seis, porque no añade ninguna razón que el lector no tuviera ya<\/td><\/tr>\n<tr><td><b>afectivo<\/b><\/td><td>el sentimiento del lector<\/td><td>«Da pena ver a esa gente levantarse a las cinco»: no cuenta como argumento, porque no justifica la tesis<\/td><\/tr>\n<\/table>\n<p>Elegir los dos argumentos de filas distintas es la manera más segura de que salgan distintos, y no la única: dos empíricos sobre el mismo dato acaban repitiendo lo mismo con dos cifras, y uno empírico y uno de analogía no pueden coincidir, porque se apoyan en materiales distintos; lo que exige el criterio es que una razón no dependa de la otra, y dos empíricas sobre terrenos separados —una en dinero y otra en salud— también cumplen. Y ninguna cita se inventa: una cifra o una frase atribuida a alguien que nunca la sostuvo es una afirmación sin respaldo.<\/p>\n\n<h3>La microtarea: a favor y en contra<\/h3>\n<p>El enunciado de 2026s pide «algún argumento a favor y alguno en contra» de que niños y niñas lleven uniforme, en no más de dos o tres líneas. Cada mitad tiene que ser un argumento —explicar por qué— y no un ejemplo ni una opinión; y las dos mitades no pueden ser la misma razón vista desde los dos lados. La respuesta se corrige por mitades: con una sola de las dos, la otra mitad queda sin contestar.<\/p>\n", "ejercicios": [{"tipo": "clasificar", "titulo": "La devolución: ¿dos razones o una?", "ops": ["dos razones distintas", "la misma razón por los dos lados", "un caso en lugar de una razón", "una preferencia sin porqué"], "ayuda": "Ocho respuestas de alumnos a la microtarea «un argumento a favor y otro en contra de que las reseñas lleven el nombre real de quien las escribe». Explica qué le pasa a cada pareja.", "items": [{"enun": "A favor: una plataforma que exige el nombre puede retirar antes las reseñas de quien nunca ha entrado en el local, porque comprueba quién es. En contra: obligaría a entregar datos personales a una empresa privada para opinar de un bar.", "sol": "dos razones distintas", "porque": "una es empírica, sobre el procedimiento de retirada; la otra, sobre los datos personales: dos filas de la tabla"}, {"enun": "A favor: a mi cuñado le pusieron una reseña falsa y no pudo hacer nada. En contra: mi vecina no quiere que su jefe sepa dónde cena.", "sol": "un caso en lugar de una razón", "porque": "dos personas concretas; falta explicar qué tienen de general el cuñado y la vecina"}, {"enun": "A favor: el nombre da más valor a la reseña. En contra: sin nombre la reseña vale menos.", "sol": "la misma razón por los dos lados", "porque": "la segunda mitad repite la primera con un <i>sin<\/i>: no hay en contra"}, {"enun": "A favor: me parece lo correcto. En contra: a mucha gente no le gustaría.", "sol": "una preferencia sin porqué", "porque": "ninguna de las dos mitades da una razón que se pueda discutir"}, {"enun": "A favor: un cliente de mi barrio dejó de escribir reseñas falsas cuando le pidieron el nombre. En contra: el bar de la esquina perdió clientes por una reseña anónima.", "sol": "un caso en lugar de una razón", "porque": "dos anécdotas; y la segunda, además, apoya el a favor"}, {"enun": "A favor: con nombre, quien escribe responde de lo que dice. En contra: mucha gente no contaría una mala experiencia si el dueño pudiera identificarla.", "sol": "dos razones distintas", "porque": "una habla de la responsabilidad de quien escribe y la otra del miedo a represalias: dos materiales"}, {"enun": "A favor: con el nombre real bajarían las reseñas falsas. En contra: sin el nombre real seguirían las reseñas falsas.", "sol": "la misma razón por los dos lados", "porque": "las dos mitades discuten el mismo dato, las reseñas falsas, y la segunda no está en contra de nada"}, {"enun": "A favor: está bien así. En contra: no me convence.", "sol": "una preferencia sin porqué", "porque": "dos opiniones sin ninguna razón detrás"}], "criterio": "Las dos parejas que puntúan entero llevan razones que no dependen una de otra, de filas distintas de la tabla. La razón doble se corrige cambiando de terreno en una de las mitades; el caso, explicando qué tiene de general; y la preferencia, añadiendo el porqué. Las tres correcciones se aplican hoy sobre la microtarea devuelta.", "apoyo": ["Lo que suele salir en la devolución de a favor y en contra"]}, {"tipo": "abierta", "titulo": "La tercera redacción corta: entre 50 y 80 palabras", "ayuda": "Veinte minutos, con el plan de tres líneas delante: tres de plan, catorce de escritura y tres de recuento y relectura en tres pasadas. El enunciado es el 2.2 real de 2017s, sobre el texto que se acaba de contestar. Como da el tema y no la pregunta, la tesis la pones tú.", "palabras": {"min": 50, "max": 80}, "items": [{"enun": "«La protagonista del texto se siente insatisfecha con sus rasgos físicos, en particular con su estatura. Redacte un texto, de entre cincuenta y ochenta palabras, sobre la importancia del aspecto físico en la autoestima.»", "conv": "2017s", "modelo": "El aspecto físico pesa en la autoestima más de lo que debería. Quien no se gusta en el espejo, como la narradora del texto, se mide con los demás, y esa comparación la pierde siempre alguien. Además, un desconocido no dispone de otra información en los primeros segundos, y muchos adultos han aprendido a juzgarse con esa misma prisa. Si la autoestima se apoyara en lo que uno hace, un palmo de estatura no la movería. — Setenta y seis palabras: tesis que admite la contraria, argumento sacado del texto, argumento de experiencia con <i>además<\/i>, cierre con consecuencia."}], "criterio": "Se corrige con las cuatro bandas y con el recuento, y hoy además con la relectura en tres pasadas antes de entregar. La tesis tiene que poder negarse: «el aspecto físico influye en la autoestima» describe, y la redacción que arranca así se queda sin nada que defender.", "apoyo": ["Un enunciado que da el tema y no la pregunta"]}, {"tipo": "clasificar", "titulo": "¿De qué tipo es el argumento?", "ops": ["empírico", "de competencia", "de autoridad", "analogía", "lugar común", "afectivo"], "ayuda": "Seis argumentos a favor de la semana de cuatro días, uno de cada tipo. Identifica cuál es cuál.", "items": [{"enun": "«Quien ha trabajado diez años seguidos de lunes a viernes sabe que el viernes por la tarde no se produce nada.»", "sol": "de competencia", "porque": "la experiencia de quien escribe, en una línea"}, {"enun": "«Todo el mundo sabe que descansar es necesario.»", "sol": "lugar común", "porque": "una idea que nadie discute y que no añade ninguna razón"}, {"enun": "«Da mucha pena ver a la gente salir de la oficina de noche.»", "sol": "afectivo", "porque": "apela al sentimiento y no justifica la tesis"}, {"enun": "«La jornada de ocho horas también pareció imposible cuando se pedía, y hoy nadie la discute.»", "sol": "analogía", "porque": "un caso parecido ya resuelto"}, {"enun": "«La autora del texto, que ha seguido el ensayo durante un año, concluye que ninguna empresa volvió a los cinco días.»", "sol": "de autoridad", "porque": "lo que sostiene quien firma el texto"}, {"enun": "«Según el ensayo del ministerio, la productividad por hora subió en treinta y dos de las cuarenta y una empresas.»", "sol": "empírico", "porque": "un dato comprobable, y sacado del texto de partida"}], "criterio": "El empírico, el de competencia, el de autoridad y la analogía sirven; el lugar común y el afectivo, no: el lugar común no añade nada y el afectivo no justifica. Y elegir los dos argumentos de una redacción de filas distintas es la manera más segura de que salgan distintos, y no la única.", "apoyo": ["De dónde se saca un argumento: los seis tipos"], "usa_texto": false}, {"tipo": "abierta", "titulo": "La microtarea de hoy: a favor y en contra", "ayuda": "Dos o tres líneas cada una. Cada mitad tiene que explicar por qué, y las dos mitades no pueden ser la misma razón. El enunciado con chapa de año es el real de 2026s y se entrega hoy; el otro se escribe sin texto de partida, sobre un asunto conocido.", "items": [{"enun": "«Indique, en no más de dos o tres líneas, algún argumento a favor y alguno en contra de que niños y niñas lleven uniforme en la escuela.»", "conv": "2026s", "modelo": "A favor: el uniforme borra en la puerta del colegio la diferencia de ropa entre familias con más y menos dinero, y con ella una de las causas de burla entre niños. En contra: obliga a cada familia a comprar unas prendas concretas, que cuestan más que la ropa corriente y no sirven fuera del colegio. Dos razones de tipo distinto, una social y una económica, y ninguna es un ejemplo."}, {"enun": "Un argumento a favor y otro en contra de la semana laboral de cuatro días con el mismo sueldo.", "modelo": "A favor: concentrar la misma tarea en cuatro días obliga a recortar reuniones y esperas, y los ensayos hechos en empresas de oficina miden menos bajas por enfermedad al cabo del año. En contra: donde el trabajo no se puede concentrar —una residencia, una caja, un turno de taller— la semana corta exige contratar a más gente, de modo que llegaría a las oficinas mucho antes que a los demás empleos. Una razón empírica y una de consecuencia, de dos filas distintas."}], "criterio": "Se corrige por mitades: media respuesta con una sola de las dos. Cada mitad se da por buena si explica por qué —un dato, una consecuencia, un caso parecido— y no si cuenta un caso o declara una preferencia.", "apoyo": ["La microtarea: a favor y en contra", "De dónde se saca un argumento: los seis tipos"]}], "cuaderno": {"pieza": 11, "apartados": [3, 6]}, "cuaderno_txt": "Pieza 11 · Escribir: el esqueleto y las dos extensiones — apartados 3 y 6: Las dos rúbricas, banda por banda; El mismo tema, en las dos extensiones (p. 66 y 73)"}, {"chapa": "El texto", "titulo": "Las tres bodas de Manolita, de Almudena Grandes", "meta": "Convocatoria 2017, tribunal especial · fragmento de novela · 320 palabras · el cuarto texto: dos de test, cuatro abiertas y la 2.1", "literal": true, "teoria": "<p>Este es el texto que se contesta hoy en clase, sobre la fotocopia del cuadernillo de 2017 (tribunal especial); aquí está para volver a él en casa. Es la segunda novela del curso y el texto con más preguntas abiertas del banco: dos de test y cuatro de escribir, y del bloque 2 se contesta también la 2.1, que pide describir a Toñito con las propias palabras. Las abiertas se corrigen de dos maneras: la 1.3 y la 1.4 se contestan copiando del texto —el enunciado de la 1.4 exige «reprodúzcalas»—, y la 1.5 y la 1.6 se corrigen poniendo la palabra propuesta en la frase original y leyéndola entera. Las líneas van numeradas para poder anotar dónde está cada respuesta; en el cuadernillo no lo están.<\/p>", "lectura": {"titulo": "Las tres bodas de Manolita (fragmento)", "entrada": "Almudena Grandes · <i>Las tres bodas de Manolita<\/i> (Barcelona: Tusquets, 2014) · fragmento, tal como lo reproduce el cuadernillo de Llengua castellana de 2017 (tribunal especial).", "lineas": ["Yo me parecía a mi madre, porque había heredado la forma de su", "cara, una torta un poco más redonda de lo que me habría", "gustado, los mofletes carnosos y los ojos oscuros, pequeños", "como botones, aunque nada me gustaba menos que mi pelo. Lo", "peor era que ni siquiera sabía de dónde había salido aquella", "ingobernable maraña de rizos diminutos, tan espantados como si", "una corriente eléctrica los achicharrara sin pausa, de la", "mañana a la noche. Cada semana, me gastaba la paga entera en", "cintas, en peinetas, en horquillas, y nunca sabía qué hacer", "con ellas, con ese pelo africano que se burlaba de mí, un", "misterio comparable a las piernas cortas, las manos de muñeca,", "el menudo tronco que me condenaba a parecer una niña perpetua", "en una familia de altos, los hombres recios como árboles, las", "mujeres esbeltas como juncos. Yo había salido a mi madre, pero", "no del todo, porque lejos de heredar un cuerpo, había heredado", "su miniatura, una réplica de proporciones fieles a la que, sin", "embargo, le faltaba casi un palmo para alcanzar las", "dimensiones del original. Con nueve años, cuatro menos que yo,", "a mi hermana Isabel le faltaban dos dedos para alcanzarme.", "", "Quizás por eso el regreso de Toñito me sentó tan bien.", "Mientras él volviera a comportarse como un hermano mayor, yo", "ocuparía un lugar a su derecha, conformándome con reflejar la", "autoridad que su huida me había forzado a ejercer antes de", "tiempo. Pero, además, daba gusto verle. Nunca me había", "parecido tan guapo como entonces, cuando se ponía lo primero", "que encontraba en el armario y se peinaba con las manos, ni", "rastro de colonia, antes de sentarse en la mesa de la cocina,", "las mejillas arreboladas, el paso firme, los ojos ardiendo en", "una luz semejante a las llamas de la fiebre, para escribir en", "unos papelitos sueltos que iba regando luego por toda la casa."], "pie": "Fragmento de <i>Las tres bodas de Manolita<\/i>, de Almudena Grandes (Tusquets, 2014), en la versión del cuadernillo oficial de la PAU +25 de 2017, Generalitat de Catalunya. Se reproduce con fines docentes, sin finalidad comercial, al amparo del artículo 32.3 de la Ley de Propiedad Intelectual. Cuadernillo: <i>Exámenes/2017_general_llengua_castellana_suplent.pdf<\/i>."}, "ejercicios": [{"tipo": "opcion", "titulo": "Las dos preguntas de test", "ayuda": "Las preguntas 1.1 y 1.2 del cuadernillo, literales, con su respuesta oficial. En la 1.2 los cuatro candidatos son femeninos: decide la sintaxis, no el género.", "items": [{"enun": "<b>1.1<\/b> La narradora se percibe a sí misma como «una niña perpetua». ¿Por qué?", "conv": "2017s", "ops": ["Porque es la hermana pequeña.", "Por las proporciones diminutas de su cuerpo.", "Porque se siente como una réplica en miniatura de su madre.", "Por la forma de su cara y su pelo."], "sol": "Por las proporciones diminutas de su cuerpo.", "porque": "la frase del texto: las piernas cortas, las manos de muñeca, el menudo tronco «que me condenaba a parecer una niña perpetua». La réplica en miniatura explica a quién se parece, no por qué parece una niña; y es la hermana mayor, no la pequeña"}, {"enun": "<b>1.2<\/b> ¿A qué o a quién se refiere la palabra <i>le<\/i> en el siguiente fragmento del texto: «a la que […] le faltaba casi un palmo para alcanzar las dimensiones del original»?", "conv": "2017s", "ops": ["A la muñeca.", "A mi madre.", "A su miniatura.", "A una réplica."], "sol": "A una réplica.", "porque": "el relativo <i>a la que<\/i> señala al sustantivo que acaba de nombrarse, <i>una réplica<\/i>, y <i>le<\/i> repite ese mismo antecedente; <i>su miniatura<\/i> nombra lo mismo unas palabras antes, pero el relativo <i>a la que<\/i> se apoya en el sustantivo inmediatamente anterior, <i>una réplica<\/i>, que es la clave oficial"}], "criterio": "Medio punto por acierto y 0,16 por error. La 1.2 es el ítem de antecedente con cuatro candidatos que concuerdan: el género no descarta nada, y lo decide releer la oración entera desde <i>una réplica de proporciones fieles<\/i>.", "apoyo": "todo"}, {"tipo": "hueco", "titulo": "La expresión equivalente", "ayuda": "Se copia del texto, sin reformular.", "items": [{"enun": "<b>1.3<\/b> ¿Con qué otra expresión, de significado equivalente, se refiere la narradora a su «pelo africano»?", "conv": "2017s", "sol": "ingobernable maraña de rizos diminutos|aquella ingobernable maraña de rizos diminutos|maraña de rizos diminutos|aquella ingobernable maraña de rizos diminutos, tan espantados como si una corriente eléctrica los achicharrara sin pausa", "porque": "clave oficial: «(aquella) ingobernable maraña de rizos diminutos». Las dos expresiones nombran el mismo pelo, y la de la maraña está cuatro líneas antes que la del pelo africano"}], "criterio": "Se da el medio punto a la expresión completa; <i>rizos<\/i> suelto o <i>mi pelo<\/i> no son otra expresión: son la misma palabra.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Dos comparaciones", "ayuda": "Se contesta copiando del texto, porque el enunciado lo pide. La comparación lleva nexo: <i>como<\/i>, <i>tan… como<\/i>; ese nexo marca dónde subrayar.", "items": [{"enun": "<b>1.4<\/b> En este texto literario se recurre con frecuencia a la comparación. Busque en el texto dos comparaciones y reprodúzcalas.", "conv": "2017s", "modelo": "Clave oficial, con tres para elegir dos: «los ojos oscuros, pequeños como botones» · «rizos diminutos, tan espantados como si una corriente eléctrica…» · «las mujeres esbeltas como juncos». Vale también «los hombres recios como árboles», que lleva el mismo nexo. Con una sola se queda en 0,25; una metáfora en lugar de una comparación —<i>una torta un poco más redonda<\/i>— pierde el medio punto entero, porque no lleva nexo."}], "criterio": "Localizar, no interpretar: se buscan los <i>como<\/i> del texto y se copian las dos frases enteras. El texto tiene cuatro con nexo; la clave recoge tres.", "apoyo": "todo"}, {"tipo": "hueco", "titulo": "Sinónimo y antónimo", "ayuda": "Las dos claves acaban en puntos suspensivos: se corrigen poniendo tu palabra en la frase del texto y leyéndola entera.", "items": [{"enun": "<b>1.5<\/b> Proponga un sinónimo de <i>arreboladas<\/i> en el sintagma «las mejillas arreboladas».", "conv": "2017s", "sol": "arrebatadas|encendidas|encarnadas|enrojecidas|rojas|coloradas|sonrojadas|ruborizadas|acaloradas|sofocadas|rubicundas|arrebatada|encendida|encarnada|enrojecida|roja|colorada|sonrojada|ruborizada", "porque": "clave oficial: <i>arrebatadas, encendidas, encarnadas, enrojecidas…<\/i> Las mejillas arreboladas son mejillas enrojecidas por el calor o la emoción; <i>rojas<\/i> se admite y pierde la causa"}, {"enun": "<b>1.6<\/b> ¿Cuál sería un antónimo posible del adjetivo <i>carnosos<\/i> en la expresión del texto «mofletes carnosos»?", "conv": "2017s", "sol": "enjutos|chupados|demacrados|huesudos|flacos|delgados|hundidos|escuálidos|descarnados|consumidos|magros|esqueléticos|enjuto|chupado|demacrado|huesudo|flaco|delgado|hundido|escuálido|descarnado|consumido|magro|esquelético", "porque": "clave oficial: <i>enjutos, chupados, demacrados, huesudos…<\/i> Se prueba en la frase: «los mofletes chupados» se sostiene; «los mofletes finos» no expresa lo contrario de carnoso"}], "criterio": "Las dos se corrigen por sustitución. <i>Rojas<\/i> se admite como sinónimo; un antónimo que no encaje en <i>mofletes<\/i> —<i>ligeros<\/i>, <i>vacíos<\/i>— no es antónimo de <i>carnosos<\/i> en ese sintagma.", "apoyo": "todo"}, {"tipo": "abierta", "titulo": "Describir a Toñito con las propias palabras", "ayuda": "Dos o tres líneas. Vale 1 punto y se corrige con la lista de rasgos de la clave; ninguna secuencia del original.", "items": [{"enun": "<b>2.1<\/b> Describa brevemente, en dos o tres líneas, y con sus propias palabras la imagen externa de Toñito, el hermano mayor de la protagonista.", "conv": "2017s", "modelo": "La clave pide que la descripción recoja la altura, la belleza, la elegancia, la firmeza y la decisión que se desprende de su mirada. Un modelo: «Toñito es alto y fuerte, como los hombres de la familia, y guapo sin arreglarse: se pone lo primero que encuentra, se peina con las manos y no usa colonia. Tiene las mejillas encendidas, el paso decidido y unos ojos que brillan como si tuviera fiebre.» Cuarenta y seis palabras, sin ninguna secuencia del original: <i>arreboladas<\/i> se ha convertido en <i>encendidas<\/i> y la luz de la fiebre en <i>brillan como si tuviera fiebre<\/i>."}], "criterio": "Se corrige por rasgos: los que la clave enumera tienen que estar, expresados con otras palabras. Copiar <i>las mejillas arreboladas, el paso firme<\/i> tal cual se considera incorrecto, aunque sean los rasgos que se piden.", "apoyo": "todo"}], "cuaderno": [{"pieza": "A-2", "apartados": [5]}, {"pieza": "TEXTOS", "apartados": [5]}], "cuaderno_txt": "Anexo A-2 · Banco de textos con sus preguntas y su clave — apartado 5: 2017, tribunal especial · Las tres bodas de Manolita (p. 257) · Los textos de cada sesión — apartado 5: «Las tres bodas de Manolita (fragmento)» · texto de examen"}, {"chapa": "Carril C", "titulo": "La tanda: figuras y sentido figurado", "meta": "10 minutos · seis ítems propios en el formato del examen, y la pregunta que separa la personificación de la metonimia", "teoria": "<p>El jueves se dieron las nueve figuras con su mecanismo y los tres ítems reales que no se leen en clase, los tres con la misma respuesta. Los cinco ítems que nombran figuras en los veinticuatro exámenes están gastados —tres el jueves y los dos de sentido figurado el 29 de septiembre y el jueves—, así que la tanda de hoy va entera con ítems propios, escritos en el formato real: cuatro nombres de figura como opciones y una frase de prosa corriente.<\/p>\n\n<h3>La metonimia, hoy sí<\/h3>\n<p>La metonimia aparece como opción en los seis, igual que en el examen, donde ha estado entre las cuatro opciones las cinco veces que se ha preguntado una figura sin ser nunca la respuesta. Aquí sí lo es una vez, y esa es la razón de ponerla: quien aprende que la metonimia nunca se marca la falla el día que sí lo es. Hay que reconocer el mecanismo, nombrar algo por una parte suya o por algo contiguo, para poder descartarla con criterio o marcarla cuando lo cumple.<\/p>\n<p>Dos de los seis se parecen y no son lo mismo: en los dos habla un objeto. Si el objeto hace algo que hacen las personas y sigue siendo el objeto —la impresora que avisa—, es una personificación. Si el objeto no hace nada de persona y ocupa el lugar del nombre de quien atiende —la ventanilla que avisa de que falta un papel—, es una metonimia. La pregunta que las separa: ¿el objeto <b>actúa<\/b> o <b>sustituye a alguien<\/b>?<\/p>", "ejercicios": [{"tipo": "opcion", "titulo": "Seis ítems en el formato del examen", "ayuda": "Seis frases con cuatro nombres de figura cada una. Busca primero el verbo; después, si habla un objeto, pregúntate si actúa o sustituye a alguien.", "items": [{"enun": "«Se pasó la tarde esperando en ventanilla y volvió como quien vuelve de una guerra» contiene", "ops": ["una comparación.", "una personificación.", "una metonimia.", "una paradoja."], "sol": "una comparación.", "porque": "lleva el nexo <i>como<\/i>"}, {"enun": "«La ventanilla le dijo que faltaba un papel» contiene", "ops": ["un hipérbaton.", "una paradoja.", "una hipérbole.", "una metonimia."], "sol": "una metonimia.", "porque": "se nombra el mostrador por la persona que atiende: la ventanilla no actúa, ocupa el lugar del nombre de alguien"}, {"enun": "«Firmó en el juzgado y salió con una tranquilidad inquieta» contiene", "ops": ["una metáfora.", "una metonimia.", "un oxímoron.", "una comparación."], "sol": "un oxímoron.", "porque": "dos palabras pegadas que se contradicen; repartida por una afirmación entera sería una paradoja"}, {"enun": "«Llevamos un año llamando a esa oficina y no contesta ni el contestador» contiene", "ops": ["una personificación.", "un oxímoron.", "una hipérbole.", "una metonimia."], "sol": "una hipérbole.", "porque": "el año exagera la espera"}, {"enun": "«La impresora avisa cuando se queda sin papel y se calla en cuanto la rellenas» contiene", "ops": ["una paradoja.", "una metonimia.", "una comparación.", "una personificación."], "sol": "una personificación.", "porque": "<i>avisar<\/i> y <i>callarse<\/i> son acciones de persona, y la impresora sigue siendo una impresora"}, {"enun": "«El taller se tragó la mitad del sueldo de marzo» contiene", "ops": ["una hipérbole.", "una metáfora.", "una metonimia.", "un hipérbaton."], "sol": "una metáfora.", "porque": "<i>tragarse<\/i> sustituye a <i>costar<\/i>: el verbo viene de otro terreno, y el taller no hace nada de persona"}], "criterio": "Cada uno se resuelve por su mecanismo: un verbo de otro terreno, una acción de persona, una exageración, dos palabras contrarias pegadas, un <i>como<\/i> y un mostrador que ocupa el lugar de quien atiende. La metonimia está de opción en los seis y es la respuesta en uno.", "apoyo": ["La metonimia, hoy sí"]}, {"tipo": "clasificar", "titulo": "¿Actúa o sustituye a alguien?", "ops": ["personificación", "metonimia"], "ayuda": "Ocho frases en las que habla o hace algo un objeto. Clasifica cada una como personificación, porque el objeto actúa, o como metonimia, porque el objeto está en el lugar del nombre de una persona o de un contenido.", "items": [{"enun": "«La calle entera protestó por el ruido.»", "sol": "metonimia", "porque": "la calle por los vecinos que viven en ella: sustituye a la gente"}, {"enun": "«El semáforo se puso a discutir con la lluvia.»", "sol": "personificación", "porque": "discutir es de personas, y ni el semáforo ni la lluvia sustituyen a nadie"}, {"enun": "«El ascensor decidió pararse entre dos pisos.»", "sol": "personificación", "porque": "decidir es de personas; el ascensor actúa"}, {"enun": "«El móvil se niega a encenderse desde el domingo.»", "sol": "personificación", "porque": "negarse es una decisión, y quien la toma es el móvil"}, {"enun": "«El tercero izquierda ha vuelto a poner la música alta.»", "sol": "metonimia", "porque": "el piso por el vecino que vive en él: sustituye a alguien"}, {"enun": "«La nevera lleva toda la noche quejándose.»", "sol": "personificación", "porque": "quejarse es de personas y no hay nadie detrás de la nevera: actúa"}, {"enun": "«Se bebió tres tazas.»", "sol": "metonimia", "porque": "el recipiente por lo que contiene"}, {"enun": "«Ha llamado el banco.»", "sol": "metonimia", "porque": "la entidad por el empleado que llama: sustituye a alguien"}], "criterio": "Cuatro de cada. En las personificaciones no hay nadie detrás del objeto: la nevera, el ascensor, el móvil y el semáforo hacen la acción. En las metonimias el objeto nombra a alguien o algo contiguo: un vecino, un empleado, una bebida, unos vecinos.", "apoyo": ["La metonimia, hoy sí"]}, {"tipo": "hueco", "titulo": "Escribe el nombre de la figura", "ayuda": "Cinco frases sin opciones: escribe el nombre de la figura.", "items": [{"enun": "«un silencio ensordecedor»", "sol": "oxímoron|oximoron", "porque": "dos palabras contrarias pegadas en un sintagma"}, {"enun": "«se leyó dos Almudenas Grandes este verano»", "sol": "metonimia", "porque": "la autora por sus novelas: se nombra la obra por quien la escribió, algo contiguo"}, {"enun": "«la ciudad se despertó con lluvia»", "sol": "personificación|personificacion", "porque": "despertarse es de personas, y la ciudad no sustituye a nadie: actúa"}, {"enun": "«el encargado tiene un corazón de <script>
/* Motor de ejercicios · PAU +25 Castellà 26-27

(function () {

  var LLAVE = 'pau2627-dia-' + String(DIA.dia).padStart(2, '0');

  /* ---------- utilidades ---------- */
  function norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\wñ\s\/-]/g, ' ')
      .replace(/-/g, '')          /* el guion de «vocal más -n» no debe decidir nada */

  /* ¿aparece el concepto «v» en el texto? Por palabra entera, no por subcadena:
     «en -l» no puede darse por bueno dentro de «en la penúltima sílaba».
     Cola flexible si la última palabra es larga: «hiato» acepta «hiatos». */
  function tiene(texto, v) {
    var t = norm(texto), q = norm(v);
    if (!q || !t) return false;
    var cola = q.split(' ').pop().length >= 5 ? '[a-zñ]{0,3}' : '';
    /* norm() ya ha dejado solo letras, cifras, espacios y barras: nada que escapar */
    var re = new RegExp('(^| )' + q + cola + '( |$)', 'g'), m;
    while ((m = re.exec(t)) !== null) {

      re.lastIndex = m.index + 1;

  }
  /* «no es aguda, es llana» no puede dar por dicho «aguda»: si en las tres
     palabras anteriores hay una negación, esa aparición no cuenta. La

     frase—, y la página lo dice junto al ejercicio. */
  function negado(antes) {
    var w = antes.trim().split(' ').slice(-3);
    return w.some(function (x) { return x === 'no' || x === 'ni' || x === 'nunca' || x === 'tampoco'; });
  }
  /* como norm(), pero SIN quitar tildes ni diéresis. Para los ejercicios en que
     el signo es la respuesta: si ahí se normaliza, «hacia» y «hacía» valen lo

  function normT(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/[^0-9a-zñáéíóúü\s,\/-]/g, ' ')  /* fuera comillas y punto final */
      .replace(/\s*,\s*/g, ', ')                 /* el espacio junto a la coma da igual */

  }

  /* ---------- la pseudoventana: el texto o la teoría, sin perder el sitio ----------

  };
  function envuelveTablas(nodo) {

  /* la teoría del carril partida en bloques: lo anterior al primer <h3> y un

  var RE_TEXTO = /(qu[ée] l[íi]nea|la l[íi]nea \d|las l[íi]neas \d|l[íi]neas? \d+|p[áa]rrafo|el texto|del texto|en el texto|fragmento|seg[úu]n (el|la) autor|la autora|el autor|el narrador|la columna)/i;
  function hablaDelTexto(ej) {

      if (ej.tipo === 'opcion') {

      } else if (ej.tipo === 'clasificar' || ej.tipo === 'emparejar') {
        campo = el('select');
        campo.appendChild(new Option('—', ''));
        (ej.ops || []).forEach(function (o) { campo.appendChild(new Option(o, o)); });
        campo.value = e.v[k] || '';
        campo.onchange = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);

      } else if (ej.tipo === 'justificar' || ej.tipo === 'abierta' || ej.tipo === 'orden') {

          campo.classList.add('larga');

            var P = ej.palabras, t = n + (n === 1 ? ' palabra' : ' palabras'), fuera = false;
            if (P.min != null && P.max != null) {

        fila.appendChild(campo);

      } else if (ej.tipo === 'cazar') {

        campo = el('div', 'caza');
        var trozos = (it.texto || '').split(/(\s+)/);
        var limpios = [];
        trozos.forEach(function (tk) {
          if (tk.trim()) limpios.push(tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, ''));
        });
        /* progreso antiguo: guardaba palabras. Se traduce a posiciones */
        var marcadas0 = String(e.v[k] || '').split('|').filter(Boolean);
        if (marcadas0.some(function (x) { return !/^\d+$/.test(x); })) {
          var conv = [];
          marcadas0.forEach(function (pal0) {
            limpios.forEach(function (l, n) { if (l === pal0) conv.push(String(n)); });
          });
          marcadas0 = conv; e.v[k] = conv.join('|'); guarda();
        }
        var j = 0;
        trozos.forEach(function (tk) {
          if (!tk.trim()) { campo.appendChild(document.createTextNode(tk)); return; }
          var limpio = tk.replace(/^[¿¡(«"']+|[.,;:!?)»"']+$/g, '');
          var ix = String(j++);
          var w = el('span', 'tk');
          w.textContent = tk;
          w.dataset.p = limpio;
          w.dataset.i = ix;
          w.setAttribute('role', 'button');
          w.tabIndex = 0;
          w.setAttribute('aria-pressed', marcadas0.indexOf(ix) !== -1 ? 'true' : 'false');
          if (marcadas0.indexOf(ix) !== -1) w.classList.add('sel');
          w.onclick = function () {
            if (/(^| )(ok|ko|medio)( |$)/.test(fila.className)) return;
            var lista = String(e.v[k] || '').split('|').filter(Boolean);
            var i2 = lista.indexOf(ix);
            if (i2 === -1) { lista.push(ix); w.classList.add('sel'); }
            else { lista.splice(i2, 1); w.classList.remove('sel'); }
            w.setAttribute('aria-pressed', lista.indexOf(ix) !== -1 ? 'true' : 'false');
            e.v[k] = lista.join('|'); guarda();
          };
          w.onkeydown = function (event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); w.click(); }
          };
          campo.appendChild(w);
        });
        fila.appendChild(campo);

      } else { /* hueco */
        campo = el('input');
        campo.type = 'text';
        if (it.corto !== false) campo.className = 'corto';
        campo.value = e.v[k] || '';
        campo.oninput = function () { e.v[k] = campo.value; cambio(); };
        lin.appendChild(campo);
      }
      if (campo && /^(INPUT|TEXTAREA|SELECT)$/.test(campo.tagName)) campo.setAttribute('aria-labelledby', enun.id);
      cont.appendChild(fila);
    });

    /* botonera */
    var bar = el('div', 'bar');
    var bC = el('button', 'acc', ej.tipo === 'abierta' || ej.tipo === 'orden' ? 'Ver la clave' : 'Corregir');
    bC.type = 'button';
    var bR = el('button', 'acc gh', 'Borrar');
    bR.type = 'button';
    var marca = el('span', 'marca', '');
    marca.setAttribute('aria-live', 'polite');
    bar.appendChild(bC); bar.appendChild(bR); bar.appendChild(marca);
    box.appendChild(bar);
    if (ej.tipo === 'cazar') box.insertBefore(el('p', 'ej-ayuda', 'Puntuación de práctica: cada palabra que debías marcar suma 1; cada selección de más resta 1. El mínimo es 0.'), cont);
    if (ej.tipo === 'justificar') box.insertBefore(el('p', 'ej-ayuda', 'Comprobación orientativa: el programa busca en tu frase los conceptos de la clave y descuenta los que niegas; no entiende la frase entera. Compara siempre con el modelo.'), cont);

    /* solución */
    var sol = el('details', 'sol');
    sol.appendChild(el('summary', null, 'La clave' + (ej.criterio ? ' y el criterio' : '')));
    var sc = el('div', 'sol-c');
    (ej.items || []).forEach(function (it, i) {
      if (it.sol) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.sol));
      else if (it.modelo) sc.appendChild(el('p', null, '<b>' + letra(i) + ')</b> ' + it.modelo));
    });
    (ej.modelos || []).forEach(function (m) { sc.appendChild(el('div', 'modelo', m)); });
    if (ej.criterio) sc.appendChild(el('div', 'crit', '<b>Criterio:</b> ' + ej.criterio));
    if (ej.remate) sc.appendChild(el('p', null, ej.remate));
    sol.appendChild(sc);
    box.appendChild(sol);

    function marcaTxt() {
      if (ej.tipo === 'abierta' || ej.tipo === 'orden') { marca.textContent = e.hecho ? 'Revisión manual: compara con la clave' : ''; return; }
      if (!e.hecho) { marca.innerHTML = e.mejor != null ? 'mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>' : ''; return; }
      var t = e.aciertos + '/' + e.total;
      if (e.mejor != null && e.mejor > e.aciertos) t += ' · mejor: <span class="mejor">' + e.mejor + '/' + e.total + '</span>';
      marca.innerHTML = t;
    }

    function corrige() {
      var ok = 0, tot = 0;
      cont.querySelectorAll('.item').forEach(function (fila, i) {
        var k = fila.dataset.k, it = ej.items[i];
        fila.classList.remove('ok', 'ko', 'medio');
        var vieja = fila.querySelector('.dice'); if (vieja) vieja.remove();
        var dado = e.v[k] || '';

        if (ej.tipo === 'abierta' || ej.tipo === 'orden') {
          if (it.modelo) {
            var d0 = el('div', 'dice h', '<b>Modelo:</b> ' + it.modelo);
            fila.appendChild(d0);
          }
          return;
        }
        if (ej.tipo !== 'cazar') tot++;   /* en «cazar» cada falta cuenta como un punto */

        if (ej.tipo === 'cazar') {
          var faltas2 = it.faltas || {};
          var pal = {}, dianas = [];
          fila.querySelectorAll('.tk').forEach(function (w) {
            pal[w.dataset.i] = w.dataset.p;
            if (Object.prototype.hasOwnProperty.call(faltas2, w.dataset.p)) dianas.push(w.dataset.i);
          });
          var marcadas = String(dado || '').split('|').filter(Boolean);
          var aciertan = marcadas.filter(function (x) { return dianas.indexOf(x) !== -1; });
          var sobran = marcadas.filter(function (x) { return dianas.indexOf(x) === -1; });
          var faltan = dianas.filter(function (x) { return marcadas.indexOf(x) === -1; });
          fila.querySelectorAll('.tk').forEach(function (w) {
            var esFalta = dianas.indexOf(w.dataset.i) !== -1,
                marcada = marcadas.indexOf(w.dataset.i) !== -1;
            w.classList.remove('sel');
            if (esFalta && marcada) w.classList.add('bien');
            else if (esFalta) w.classList.add('perdida');
            else if (marcada) w.classList.add('sobra');
          });
          var voces = function (lista) {
            var vistas = [];
            lista.forEach(function (x) { if (vistas.indexOf(pal[x]) === -1) vistas.push(pal[x]); });
            return vistas;
          };
          var puntos = Math.max(0, aciertan.length - sobran.length);
          tot += dianas.length; ok += puntos;
          var msg = '<b>' + puntos + ' de ' + dianas.length + '.</b> Aciertos: ' + aciertan.length + '. Selecciones de más: ' + sobran.length + '. ';
          if (faltan.length) msg += 'Se te han escapado: ' + voces(faltan).map(function (x) {
            return '<b>' + x + '</b> → ' + faltas2[x]; }).join(' · ') + '. ';
          if (sobran.length) msg += 'No correspondía marcar: ' + voces(sobran).join(', ') + '.';
          if (!faltan.length && !sobran.length) msg = '<b>Las ' + dianas.length + '.</b> Ni una de más.';
          fila.appendChild(el('div', 'dice ' + (faltan.length || sobran.length ? 'h' : 'b'), msg));
          fila.classList.add(faltan.length || sobran.length ? 'medio' : 'ok');
          e.r[k] = puntos;
          return;
        }

        if (ej.tipo === 'justificar') {
          var faltan = (it.requiere || []).filter(function (grupo) {
            return !grupo.some(function (v) { return tiene(dado, v); });
          });
          if (!dado.trim()) {
            fila.classList.add('ko');
            fila.appendChild(el('div', 'dice m', 'Sin contestar.'));
          } else if (faltan.length === 0) {
            ok++; fila.classList.add('ok');
            fila.appendChild(el('div', 'dice b', '<b>Completa.</b> Están las dos mitades.'));
          } else {
            fila.classList.add('medio');
            var pistas = faltan.map(function (g) { return '<b>' + g[0] + '</b>'; }).join(' · ');
            fila.appendChild(el('div', 'dice h',
              'Falta una parte: ' + pistas +
              '. Compara con el modelo: la respuesta completa lleva las dos.'));
          }
          e.r[k] = faltan.length === 0 ? 1 : 0;
          return;
        }

        var espera = it.sol_c != null ? it.sol_c : it.sol;
        var estricto = !!(ej.estricto || it.estricto);
        var bien = coincide(dado, espera, estricto);
        e.r[k] = bien ? 1 : 0;
        if (bien) { ok++; fila.classList.add('ok'); }
        else {
          fila.classList.add('ko');
          var t = dado.trim() ? '<b>No.</b> ' : 'Sin contestar. ';
          /* la palabra es la buena y solo falla el signo: eso se dice aparte */
          if (dado.trim() && estricto && coincide(dado, espera, false))
            t = '<b>Casi.</b> La palabra es esa; lo que está mal puesto es el signo. Va así: ';
          t += String(espera).split('|')[0];
          if (it.porque) t += ' — ' + it.porque;
          fila.appendChild(el('div', 'dice m', t));
        }
      });

      e.hecho = true; e.aciertos = ok; e.total = tot;
      e.mejor = (e.mejor == null) ? ok : Math.max(e.mejor, ok);
      guarda(); marcaTxt(); sol.open = true; progreso();
      if (tot) aviso(ok + ' de ' + tot);
    }

    bC.onclick = corrige;
    bR.onclick = function () {
      e.v = {}; e.r = {}; e.hecho = false; e.aciertos = 0;
      guarda();
      cont.querySelectorAll('.item').forEach(function (f) {
        f.classList.remove('ok', 'ko', 'medio');
        var d = f.querySelector('.dice'); if (d) d.remove();
        f.querySelectorAll('input,textarea').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('select').forEach(function (x) { x.value = ''; });
        f.querySelectorAll('.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        f.querySelectorAll('.tk').forEach(function (x) { x.classList.remove('sel', 'bien', 'perdida', 'sobra'); x.setAttribute('aria-pressed', 'false'); });
      });
      sol.open = false; marcaTxt(); progreso();
    };

    marcaTxt();
    if (e.hecho) corrige();
    ejercicios.push({ n: n, ej: ej });
    return box;
  }

  /* ---------- progreso ---------- */
  function progreso() {
    var hechos = 0, tot = 0, ac = 0, punt = 0;
    ejercicios.forEach(function (x) {
      var e = estado[x.n];
      if (x.ej.tipo === 'abierta' || x.ej.tipo === 'orden') return;
      tot++;
      if (e && e.hecho) { hechos++; ac += e.aciertos; punt += e.total; }
    });
    var pc = tot ? Math.round(hechos / tot * 100) : 0;
    document.querySelector('.barra>i').style.width = pc + '%';
    document.getElementById('progtxt').innerHTML =
      hechos + ' de ' + tot + ' corregidos' + (punt ? ' · <b>' + ac + '/' + punt + '</b>' : '');
  }

  /* ---------- exportar / importar ---------- */
  function exporta() {
    var datos = { unidad: DIA.dia, fecha: DIA.fecha, curso: 'PAU +25 Castellà 26-27', estado: estado };
    var b = new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'pau-dia-' + String(DIA.dia).padStart(2, '0') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    aviso('Progreso descargado');
  }
  function importa() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var e2 = d.estado || d;
          if (d.curso && d.curso.indexOf('PAU') < 0) {
            aviso('Ese archivo es de otra materia, no de PAU +25'); return;
          }
          if (d.unidad != null && String(d.unidad) !== String(DIA.dia)) {
            aviso('Ese archivo es del día ' + d.unidad + ', no de este'); return;
          }
          if (DIA.revision && e2._rev && e2._rev !== DIA.revision) {
            aviso('Ese progreso es de otra versión de esta página y no se puede cargar'); return;
          }
          if (typeof e2 !== 'object' || e2 === null) { aviso('Ese archivo no se puede leer'); return; }
          estado = e2;
          guarda(); location.reload();
        } catch (e) { aviso('Ese archivo no se puede leer'); }
      };
      fr.readAsText(f);
    };
    i.click();
  }

  /* ---------- arranque ---------- */
  function arranca() {
    carga();
    var env = document.querySelector('.env');
    /* accesos a los carriles, fijos arriba: la página es larga y en móvil más */
    if (DIA.carriles.length > 1) {
      var nav = el('nav', 'carriles');
      DIA.carriles.forEach(function (c, i) {
        var a = el('a', null, c.chapa.replace('Carril ', '') + ' · ' + c.titulo);
        a.href = '#carril-' + (i + 1);
        nav.appendChild(a);
      });
      env.appendChild(nav);
    }
    /* el primer carril del día que lleva texto, para los ejercicios de otros
       carriles que preguntan por él */
    var lecturaDelDia = -1;
    DIA.carriles.forEach(function (x, i) { if (lecturaDelDia < 0 && x.lectura) lecturaDelDia = i; });
    DIA.carriles.forEach(function (c, ci) {
      var sec = el('section', 'carril');
      sec.id = 'carril-' + (ci + 1);
      var h2 = el('h2', null, '');
      h2.appendChild(el('span', 'chapa', c.chapa));
      h2.appendChild(el('span', null, c.titulo));
      sec.appendChild(h2);
      if (c.meta) sec.appendChild(el('p', 'meta', c.meta));
      /* de donde sale esto en el dossier de papel, con su pagina: es lo que
         contesta «abran el cuaderno, pero por donde» cuando alguien llega a
         clase con el dossier impreso y no con la pagina */
      if (c.cuaderno_txt) {
        sec.appendChild(el('p', 'cuaderno',
          '<b>En el dossier:</b> ' + c.cuaderno_txt));
      }
      /* el texto de partida, con las líneas numeradas como en el examen */
      if (c.lectura) {
        var L = c.lectura;
        var caja = el('div', 'lectura');
        caja.id = 'lectura-' + (ci + 1);
        if (L.titulo) caja.appendChild(el('div', 'lec-t', L.titulo));
        if (L.entrada) caja.appendChild(el('div', 'lec-f', L.entrada));
        var cuerpo = el('div', 'lec-c'), nlin = 0;
        (L.lineas || []).forEach(function (t) {
          if (!t) { cuerpo.appendChild(el('div', 'lec-l blanco')); return; }  /* el hueco entre
                                                       párrafos no gasta número, como en la prueba */
          nlin++;
          var fila = el('div', 'lec-l');
          fila.appendChild(el('span', 'lec-n', String(nlin)));   /* todas numeradas */
          fila.appendChild(el('span', 'lec-x', t));
          cuerpo.appendChild(fila);
        });
        caja.appendChild(cuerpo);
        if (L.pie) caja.appendChild(el('div', 'lec-p', L.pie));
        sec.appendChild(caja);
      }
      if (c.teoria) {
        var t = el('div', null, c.teoria);
        t.querySelectorAll('table').forEach(function (tb) {
          var w = el('div', 'tabla-scroll');
          tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
        });
        sec.appendChild(t);
      }
      (c.ejercicios || []).forEach(function (ej) {
        var box = pinta(ej, ejercicios.length);
        var cab = box.querySelector('.ej-h');
        var iconos = el('div', 'ej-icos');
        /* las preguntas van sobre el texto: se abre encima, sin perder el sitio.
           Si el carril no tiene texto pero el día sí, en otro carril, y el
           ejercicio pregunta por él, el icono abre ese */
        var li = c.lectura ? ci : (hablaDelTexto(ej) ? lecturaDelDia : -1);
        if (li >= 0) {
          var bt = botonIcono('ico-texto', ICONO.texto, 'texto', 'Ver el texto');
          bt.onclick = function () {
            var copia = document.getElementById('lectura-' + (li + 1)).cloneNode(true);
            copia.removeAttribute('id');
            var t0 = copia.querySelector('.lec-t');   /* el título ya va en la cabecera de la ventana */
            if (t0) t0.remove();
            abreVentana(c.chapa + ' · el texto', DIA.carriles[li].lectura.titulo || 'El texto', copia, bt);
          };
          iconos.appendChild(bt);
        }
        if (c.teoria) {
          var bq = botonIcono('ico-teoria', ICONO.teoria, 'teoría', 'Ver la teoría que ayuda con este ejercicio');
          bq.onclick = function () {
            abreVentana(c.chapa + ' · teoría para este ejercicio', ej.titulo, teoriaDe(c, ej), bq);
          };
          iconos.appendChild(bq);
        }
        if (iconos.children.length) cab.appendChild(iconos);
        sec.appendChild(box);
      });
      env.appendChild(sec);
    });
    if (DIA.pie) {
      var f = el('footer', 'fin', DIA.pie);
      env.appendChild(f);
    }
    document.getElementById('bexp').onclick = exporta;
    document.getElementById('bimp').onclick = importa;
    document.getElementById('bres').onclick = function () {
      if (!confirm('¿Borrar todo el progreso de este día?')) return;
      localStorage.removeItem(LLAVE); location.reload();
    };
    progreso();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arranca);
  else arranca();
})();

</script>
</body>
